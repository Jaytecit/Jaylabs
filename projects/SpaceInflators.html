<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VR Space Invaders: Arcade Evolution</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', 'Trebuchet MS', sans-serif;
      background: radial-gradient(circle at 20% 20%, #0b1230 0%, #050510 45%, #030309 80%);
      color: #d8f2ff;
      letter-spacing: 0.5px;
    }
    .hud-text { text-transform: uppercase; }
    #mode-buttons {
      position: fixed;
      top: 12px;
      left: 12px;
      display: flex;
      gap: 8px;
      z-index: 10;
      font-family: inherit;
    }
    #mode-buttons button {
      background: #0f1a3c;
      color: #d8f2ff;
      border: 1px solid #35c6ff;
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(53,198,255,0.4);
      font-size: 14px;
    }
    #mode-buttons button:hover {
      background: #13244f;
    }
  </style>
</head>
<body>
  <div id="mode-buttons">
    <button id="desktop-btn">Desktop Mode</button>
    <button id="vr-btn">VR Mode</button>
  </div>
  <a-scene background="color: #050510" renderer="antialias: true; colorManagement: true">
    <a-assets>
      <canvas id="hud-canvas" width="1024" height="320"></canvas>
    </a-assets>

    <a-sky color="#04060f"></a-sky>

    <!-- Lighting -->
    <a-entity light="type: ambient; color: #888"></a-entity>
    <a-entity light="type: directional; color: #fff; intensity: 0.6" position="0 10 -5"></a-entity>

    <!-- Floor and Grid -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="200" height="200"
             material="color: #0b1220; metalness:0.4; roughness:0.8"></a-plane>
    <a-entity geometry="primitive: plane; width: 200; height: 200"
              position="0 0.01 0" rotation="-90 0 0"
              material="color: #2ddcff; opacity: 0.18; wireframe: true; side: double"></a-entity>

    <!-- Environmental accents -->
    <a-entity id="environment">
      <a-entity geometry="primitive: torus; radius: 7.5; radiusTubular: 0.05" rotation="90 0 0"
                position="0 0.2 -10" material="color: #123357; emissive: #0c4b9f; opacity: 0.55"></a-entity>
      <a-entity geometry="primitive: torus; radius: 11; radiusTubular: 0.05" rotation="90 0 0"
                position="0 0.2 -14" material="color: #111; emissive: #0d5f7f; opacity: 0.35"></a-entity>
      <a-entity geometry="primitive: box; width: 1; height: 4; depth: 1" position="-8 2 -18"
                material="color: #0e1a2f; emissive: #0a6bb5; opacity: 0.45"></a-entity>
      <a-entity geometry="primitive: box; width: 0.8; height: 3.2; depth: 0.8" position="8 1.6 -16"
                material="color: #0e1a2f; emissive: #0a6bb5; opacity: 0.45"></a-entity>
      <a-entity id="starfield"></a-entity>
    </a-entity>

    <!-- Menu -->
    <a-entity id="menu" position="0 0 0">
      <a-entity class="menu-cube" data-difficulty="easy" position="-2.5 2 -3.5">
        <a-ring color="#12ff8b" radius-inner="0.35" radius-outer="0.45" rotation="-90 0 0"></a-ring>
      </a-entity>
      <a-text value="EASY" color="#00ff7f" position="-2.95 1.4 -3.5"></a-text>

      <a-entity class="menu-cube" data-difficulty="normal" position="0 2 -3.5">
        <a-ring color="#00aaff" radius-inner="0.35" radius-outer="0.45" rotation="-90 0 0"></a-ring>
      </a-entity>
      <a-text value="NORMAL" color="#00aaff" position="-0.55 1.4 -3.5"></a-text>

      <a-entity class="menu-cube" data-difficulty="hard" position="2.5 2 -3.5">
        <a-ring color="#ff5f5f" radius-inner="0.35" radius-outer="0.45" rotation="-90 0 0"></a-ring>
      </a-entity>
      <a-text value="HARD" color="#ff5f5f" position="2.1 1.4 -3.5"></a-text>
    </a-entity>


    <!-- Player Rig -->
    <a-entity id="rig" position="0 0 0">
      <a-entity id="camera" camera position="0 1.6 0"></a-entity>

      <a-entity id="rightHand" oculus-touch-controls="hand: right" gun="hand: right">
        <a-entity id="gun-container-right" rotation="-35 0 0">
          <a-entity geometry="primitive: box; width: 0.12; height: 0.22; depth: 0.5"
                    material="color: #00ffd5; wireframe: true; transparent: true; opacity: 0.7; emissive: #00ffd5; emissiveIntensity: 0.75"></a-entity>
          <a-entity geometry="primitive: cylinder; radius: 0.05; height: 0.55" rotation="90 0 0" position="0 0 -0.3"
                    material="color: #7df3ff; wireframe: true; transparent: true; opacity: 0.7; emissive: #7df3ff; emissiveIntensity: 0.8"></a-entity>
          <a-entity geometry="primitive: torus; radius: 0.09; radiusTubular: 0.015" rotation="90 0 0" position="0 0.07 -0.05"
                    material="color: #ffb347; wireframe: true; transparent: true; opacity: 0.6; emissive: #ffb347; emissiveIntensity: 0.7"></a-entity>
          <a-entity geometry="primitive: octahedron; radius: 0.06" position="0 -0.06 0.1"
                    material="color: #ff4e90; wireframe: true; transparent: true; opacity: 0.7; emissive: #ff4e90; emissiveIntensity: 0.7"></a-entity>
          <a-entity geometry="primitive: cone; radiusBottom: 0.06; radiusTop: 0.02; height: 0.2" position="0 -0.08 0.25" rotation="-90 0 0"
                    material="color: #7df3ff; wireframe: true; transparent: true; opacity: 0.7; emissive: #7df3ff; emissiveIntensity: 0.7"></a-entity>
          <a-entity id="muzzle-right" position="0 0.03 -0.45"></a-entity>
        </a-entity>
      </a-entity>

      <a-entity id="leftHand" oculus-touch-controls="hand: left" gun="hand: left">
        <a-entity id="gun-container-left" class="offhand-gun" rotation="-30 0 0" visible="false">
          <a-entity geometry="primitive: box; width: 0.1; height: 0.18; depth: 0.42"
                    material="color: #9fe3ff; wireframe: true; transparent: true; opacity: 0.7; emissive: #9fe3ff; emissiveIntensity: 0.75"></a-entity>
          <a-entity geometry="primitive: cylinder; radius: 0.045; height: 0.5" rotation="90 0 0" position="0 0 -0.28"
                    material="color: #4df5ff; wireframe: true; transparent: true; opacity: 0.7; emissive: #4df5ff; emissiveIntensity: 0.8"></a-entity>
          <a-entity geometry="primitive: torus; radius: 0.11; radiusTubular: 0.02" rotation="90 0 0" position="0 0.05 -0.02"
                    material="color: #7df3ff; wireframe: true; transparent: true; opacity: 0.6; emissive: #7df3ff; emissiveIntensity: 0.7"></a-entity>
          <a-entity geometry="primitive: octahedron; radius: 0.05" position="0 -0.05 0.12"
                    material="color: #4dd6ff; wireframe: true; transparent: true; opacity: 0.7; emissive: #4dd6ff; emissiveIntensity: 0.7"></a-entity>
          <a-entity geometry="primitive: cone; radiusBottom: 0.05; radiusTop: 0.02; height: 0.18" position="0 -0.06 0.22" rotation="-90 0 0"
                    material="color: #9fe3ff; wireframe: true; transparent: true; opacity: 0.7; emissive: #9fe3ff; emissiveIntensity: 0.7"></a-entity>
          <a-entity id="muzzle-left" position="0 0.03 -0.4"></a-entity>
        </a-entity>
      </a-entity>

      <a-entity id="frontShield" position="0 1.35 -0.9" shield>
        <a-ring id="shield-disc" radius-inner="0.82" radius-outer="0.88" position="0 0 0" rotation="0 0 0"
                material="color: #8ad8ff; wireframe: true; opacity: 0.4; transparent: true; side: double; depthTest: false"></a-ring>
      </a-entity>
    </a-entity>

    <a-entity id="world-hud">
      <a-plane id="hud-panel" position="0 9.4 -32" width="5.6" height="1.7"
               material="shader: flat; transparent: true; src: #hud-canvas" look-at="#camera"></a-plane>
    </a-entity>

    <a-entity id="game-manager" game-manager></a-entity>
  </a-scene>

  <script>
    const SOUND_TYPES = {
      shoot: { type: 'sawtooth', freq: 800, decay: 0.08, gain: 0.2 },
      move: { type: 'square', freq: 80, decay: 0.1, gain: 0.15 },
      explosion: { type: 'sawtooth', freq: 50, decay: 0.6, gain: 0.4 },
      powerup: { type: 'sine', freq: 1000, decay: 0.4, gain: 0.2 },
      shield: { type: 'sine', freq: 400, decay: 0.2, gain: 0.25 }
    };

    function makeTone(ctx, { type, freq, decay, gain }) {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      osc.connect(g);
      g.connect(ctx.destination);
      const now = ctx.currentTime;
      g.gain.setValueAtTime(gain, now);
      g.gain.exponentialRampToValueAtTime(0.0001, now + decay);
      osc.start(now);
      osc.stop(now + decay);
    }

    function randomChoice(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function clamp(val, min, max) {
      return Math.min(max, Math.max(min, val));
    }

    function cubicBezier(p0, p1, p2, p3, t) {
      const u = 1 - t;
      const tt = t * t;
      const uu = u * u;
      const uuu = uu * u;
      const ttt = tt * t;
      return new THREE.Vector3(
        (uuu * p0.x) + (3 * uu * t * p1.x) + (3 * u * tt * p2.x) + (ttt * p3.x),
        (uuu * p0.y) + (3 * uu * t * p1.y) + (3 * u * tt * p2.y) + (ttt * p3.y),
        (uuu * p0.z) + (3 * uu * t * p1.z) + (3 * u * tt * p2.z) + (ttt * p3.z)
      );
    }

    const WEAPON_COLORS = {
      blaster: '#00ffc8',
      spread: '#ffb347',
      nova: '#ff6470',
      rail: '#7df3ff',
      bomb: '#ff6470',
      special: '#7df3ff'
    };

    function weaponLabel(type) {
      if (type === 'spread') return 'Spread';
      if (type === 'nova') return 'Nova';
      if (type === 'rail') return 'Rail';
      if (type === 'capture') return 'Capture';
      return 'Blaster';
    }

    const POWERUP_LEGEND = [
      'weaponUp', 'spread', 'nova', 'rail', 'shield', 'shieldBoost',
      'extraLife', 'scoreBoost', 'freeze', 'overclock', 'bulletTime', 'magnet', 'cleanse'
    ];

    const POWERUP_DEFS = {
      weaponUp: { label: 'Weapon Up', color: '#7df3ff' },
      spread: { label: 'Spread', color: '#ffb347', weapon: 'spread' },
      nova: { label: 'Nova', color: '#ff6470', weapon: 'nova' },
      rail: { label: 'Rail', color: '#7df3ff', weapon: 'rail' },
      shield: { label: 'Shield', color: '#4dd6ff' },
      shieldBoost: { label: 'Shield+', color: '#5effc1' },
      extraLife: { label: 'Life', color: '#ffd24d' },
      scoreBoost: { label: 'Score', color: '#ffe86e' },
      freeze: { label: 'Pause', color: '#9fdcff', duration: 7000 },
      overclock: { label: 'Overclock', color: '#ff4e90', duration: 5200 },
      bulletTime: { label: 'Bullet Time', color: '#7bc6ff', duration: 5600 },
      magnet: { label: 'Magnet', color: '#f5a8ff', duration: 6800 },
      cleanse: { label: 'Cleanse', color: '#00ffd5' }
    };

    const POWERUP_POOL = [
      { type: 'weaponUp', weight: 3 },
      { type: 'spread', weight: 2 },
      { type: 'nova', weight: 2 },
      { type: 'rail', weight: 2 },
      { type: 'shield', weight: 3 },
      { type: 'shieldBoost', weight: 2 },
      { type: 'extraLife', weight: 1 },
      { type: 'scoreBoost', weight: 3 },
      { type: 'freeze', weight: 1 },
      { type: 'overclock', weight: 2 },
      { type: 'bulletTime', weight: 2 },
      { type: 'magnet', weight: 1 },
      { type: 'cleanse', weight: 2 }
    ];

    function pickPowerupType() {
      const total = POWERUP_POOL.reduce((sum, item) => sum + item.weight, 0);
      let roll = Math.random() * total;
      for (const item of POWERUP_POOL) {
        roll -= item.weight;
        if (roll <= 0) return item.type;
      }
      return POWERUP_POOL[0].type;
    }

    const BOSS_REWARDS = ['dual', 'shieldBoost', 'weaponUp', 'extraLife', 'overclock'];
    const BOSS_DEFS = [
      { id: 'pulse', name: 'Pulse Warden', body: '#48c7ff', accent: '#9fe3ff', core: 'octahedron', profile: 'halo', weapon: 'burst', motion: 'sway', baseHealth: 22 },
      { id: 'arc', name: 'Arc Tyrant', body: '#ff7ad9', accent: '#ffb347', core: 'dodecahedron', profile: 'wings', weapon: 'sweep', motion: 'wide', baseHealth: 26 },
      { id: 'spiral', name: 'Spiral Siren', body: '#9cff57', accent: '#39ffb4', core: 'icosahedron', profile: 'spires', weapon: 'spiral', motion: 'orbit', baseHealth: 28 },
      { id: 'ring', name: 'Ring Sovereign', body: '#ffd24d', accent: '#ff8c3b', core: 'sphere', profile: 'rings', weapon: 'ring', motion: 'hover', baseHealth: 30 },
      { id: 'mine', name: 'Mine Weaver', body: '#a88cff', accent: '#ff6fd8', core: 'tetrahedron', profile: 'crown', weapon: 'mine', motion: 'sway', baseHealth: 34 },
      { id: 'split', name: 'Splitclaw', body: '#5effc1', accent: '#18ffd5', core: 'octahedron', profile: 'blades', weapon: 'split', motion: 'zigzag', baseHealth: 36 },
      { id: 'lancer', name: 'Lancer Prime', body: '#ff6b6b', accent: '#ffd2a6', core: 'dodecahedron', profile: 'spear', weapon: 'rail', motion: 'dash', baseHealth: 38 },
      { id: 'drone', name: 'Drone Queen', body: '#7c9cff', accent: '#b86bff', core: 'icosahedron', profile: 'bulwark', weapon: 'burst', motion: 'sway', baseHealth: 42, minionBoost: 1 },
      { id: 'storm', name: 'Storm Herald', body: '#55e7ff', accent: '#ffcc55', core: 'octahedron', profile: 'hex', weapon: 'fan', motion: 'figure8', baseHealth: 46 },
      { id: 'overlord', name: 'Overlord Prime', body: '#ff4e90', accent: '#00ffd5', core: 'dodecahedron', profile: 'titan', weapon: 'chaos', motion: 'orbit', baseHealth: 52, chaosBoost: 1 }
    ];

    function spawnSparkBurst(scene, at, color = '#ffffff', count = 10, spread = 0.8, size = 0.05, life = 400) {
      if (!scene) return;
      for (let i = 0; i < count; i++) {
        const spark = document.createElement('a-sphere');
        spark.setAttribute('radius', size * (0.5 + Math.random() * 0.8));
        spark.setAttribute('color', color);
        const pos = {
          x: at.x + (Math.random() - 0.5) * spread,
          y: at.y + (Math.random() - 0.5) * spread,
          z: at.z + (Math.random() - 0.5) * spread
        };
        spark.setAttribute('position', `${pos.x} ${pos.y} ${pos.z}`);
        spark.setAttribute('animation__scale', `property: scale; to: 0 0 0; dur: ${life}; easing: linear`);
        spark.setAttribute('animation__fade', `property: material.opacity; to: 0; dur: ${life}; easing: linear`);
        scene.appendChild(spark);
        setTimeout(() => spark.parentNode && spark.parentNode.removeChild(spark), life + 20);
      }
    }

    function createStarField(scene) {
      const holder = document.getElementById('starfield');
      if (!holder || !scene) return [];
      const stars = [];
      for (let i = 0; i < 80; i++) {
        const star = document.createElement('a-sphere');
        star.setAttribute('radius', 0.04 + Math.random() * 0.05);
        star.setAttribute('color', '#9fe3ff');
        const x = (Math.random() - 0.5) * 80;
        const y = 6 + Math.random() * 16;
        const z = -30 - Math.random() * 50;
        const speed = 0.002 + Math.random() * 0.003;
        star.dataset.speed = speed;
        star.setAttribute('position', `${x} ${y} ${z}`);
        star.setAttribute('animation__twinkle', `property: material.opacity; dir: alternate; dur: ${1200 + Math.random() * 900}; to: 0.1; loop: true; easing: easeInOutQuad`);
        holder.appendChild(star);
        stars.push({ el: star, speed, baseY: y });
      }
      for (let p = 0; p < 2; p++) {
        const planet = document.createElement('a-sphere');
        planet.setAttribute('radius', 1.5 + Math.random());
        planet.setAttribute('color', '#4455aa');
        planet.setAttribute('material', 'metalness:0.3; roughness:0.8; opacity:0.6');
        const px = (Math.random() - 0.5) * 50;
        const py = 8 + Math.random() * 6;
        const pz = -60 - Math.random() * 20;
        const pspeed = 0.0005 + Math.random() * 0.0008;
        planet.dataset.speed = pspeed;
        planet.setAttribute('position', `${px} ${py} ${pz}`);
        holder.appendChild(planet);
        stars.push({ el: planet, speed: pspeed, baseY: py });
      }
      return stars;
    }

    function wireframeMaterial(color, opacity = 0.7, emissive = color) {
      return `color: ${color}; emissive: ${emissive}; emissiveIntensity: 0.75; wireframe: true; opacity: ${opacity}; transparent: true; metalness:0.2; roughness:0.35`;
    }

    function addWireframePart(root, geometry, color, position, rotation, scale, opacity = 0.7) {
      const part = document.createElement('a-entity');
      part.setAttribute('geometry', geometry);
      part.setAttribute('material', wireframeMaterial(color, opacity));
      if (position) part.setAttribute('position', position);
      if (rotation) part.setAttribute('rotation', rotation);
      if (scale) part.setAttribute('scale', scale);
      root.appendChild(part);
      return part;
    }

    function createWireframeInvader(type) {
      const palette = {
        squid: { main: '#7df3ff', accent: '#1ac6ff' },
        crab: { main: '#ff7ad9', accent: '#ffb347' },
        bug: { main: '#9cff57', accent: '#39ffb4' }
      };
      const theme = palette[type] || palette.crab;
      const root = document.createElement('a-entity');
      root.setAttribute('class', 'invader');

      addWireframePart(root, 'primitive: icosahedron; radius: 0.35', theme.main, '0 0 0', null, null, 0.75);
      addWireframePart(root, 'primitive: torus; radius: 0.42; radiusTubular: 0.04', theme.accent, '0 0 0', '90 0 0', null, 0.6);

      if (type === 'squid') {
        addWireframePart(root, 'primitive: cone; radiusBottom: 0.18; radiusTop: 0.02; height: 0.5', theme.accent, '0 -0.38 0', '0 0 0');
        addWireframePart(root, 'primitive: cone; radiusBottom: 0.14; radiusTop: 0.02; height: 0.45', theme.main, '-0.18 -0.35 0', '0 15 0');
        addWireframePart(root, 'primitive: cone; radiusBottom: 0.14; radiusTop: 0.02; height: 0.45', theme.main, '0.18 -0.35 0', '0 -15 0');
        addWireframePart(root, 'primitive: sphere; radius: 0.2', theme.accent, '0 0.32 0');
      } else if (type === 'bug') {
        addWireframePart(root, 'primitive: octahedron; radius: 0.3', theme.accent, '0 0 0.18', null, '0.8 0.8 0.8');
        addWireframePart(root, 'primitive: cone; radiusBottom: 0.12; radiusTop: 0.02; height: 0.5', theme.main, '0 -0.18 -0.35', '90 0 0');
        addWireframePart(root, 'primitive: torus; radius: 0.3; radiusTubular: 0.03', theme.main, '0 0.1 0.15', '0 90 0', null, 0.55);
      } else {
        addWireframePart(root, 'primitive: box; width: 0.8; height: 0.12; depth: 0.4', theme.main, '0 0 0', null, null, 0.6);
        addWireframePart(root, 'primitive: box; width: 0.25; height: 0.08; depth: 0.55', theme.accent, '-0.42 0 0', '0 12 0', null, 0.55);
        addWireframePart(root, 'primitive: box; width: 0.25; height: 0.08; depth: 0.55', theme.accent, '0.42 0 0', '0 -12 0', null, 0.55);
        addWireframePart(root, 'primitive: sphere; radius: 0.16', theme.accent, '0 0.22 0');
      }
      return root;
    }

    function createEnemyProjectile(color = '#ff4e90', radius = 0.16, opacity = 0.75) {
      const bullet = document.createElement('a-entity');
      bullet.setAttribute('geometry', `primitive: octahedron; radius: ${radius}`);
      bullet.setAttribute('material', wireframeMaterial(color, opacity));
      bullet.setAttribute('rotation', `${Math.random() * 180} ${Math.random() * 180} ${Math.random() * 180}`);
      return bullet;
    }

    function applyBossAimBias(dir, bias = 0.25) {
      dir.y -= bias;
      return dir.normalize();
    }

    function createWireframeBoss(def, stage) {
      const root = document.createElement('a-entity');
      const size = 1 + stage * 0.08;
      const coreRadius = 1.35 + stage * 0.1;
      addWireframePart(root, `primitive: ${def.core || 'octahedron'}; radius: ${coreRadius}`, def.body, '0 0 0', null, null, 0.6);
      const accent = def.accent || def.body;
      if (def.profile === 'halo') {
        addWireframePart(root, 'primitive: torus; radius: 1.8; radiusTubular: 0.05', accent, '0 0 0', '90 0 0', `${size} ${size} ${size}`, 0.55);
        addWireframePart(root, 'primitive: cone; radiusBottom: 0.35; radiusTop: 0.05; height: 0.9', accent, '0 0.9 0', '0 0 0', null, 0.6);
      } else if (def.profile === 'wings') {
        addWireframePart(root, 'primitive: box; width: 2.2; height: 0.12; depth: 0.6', accent, '0 0 0', null, `${size} 1 ${size}`, 0.55);
        addWireframePart(root, 'primitive: box; width: 0.4; height: 0.2; depth: 1.2', accent, '-1.4 0 0', '0 12 0', null, 0.5);
        addWireframePart(root, 'primitive: box; width: 0.4; height: 0.2; depth: 1.2', accent, '1.4 0 0', '0 -12 0', null, 0.5);
      } else if (def.profile === 'spires') {
        addWireframePart(root, 'primitive: cone; radiusBottom: 0.25; radiusTop: 0.02; height: 1.1', accent, '0 1 0', null, null, 0.6);
        addWireframePart(root, 'primitive: cone; radiusBottom: 0.2; radiusTop: 0.02; height: 0.9', accent, '0 -1 0', '180 0 0', null, 0.6);
        addWireframePart(root, 'primitive: torus; radius: 1.2; radiusTubular: 0.04', accent, '0 0 0', '0 90 0', `${size} ${size} ${size}`, 0.55);
      } else if (def.profile === 'rings') {
        addWireframePart(root, 'primitive: torus; radius: 1.6; radiusTubular: 0.05', accent, '0 0 0', '90 0 0', `${size} ${size} ${size}`, 0.55);
        addWireframePart(root, 'primitive: torus; radius: 1.3; radiusTubular: 0.04', accent, '0 0 0', '0 90 0', `${size} ${size} ${size}`, 0.55);
      } else if (def.profile === 'crown') {
        addWireframePart(root, 'primitive: torus; radius: 1.5; radiusTubular: 0.05', accent, '0 0.2 0', '90 0 0', `${size} ${size} ${size}`, 0.55);
        for (let i = 0; i < 6; i++) {
          const angle = (Math.PI * 2 * i) / 6;
          const x = Math.cos(angle) * 1.2;
          const z = Math.sin(angle) * 1.2;
          addWireframePart(root, 'primitive: cone; radiusBottom: 0.18; radiusTop: 0.02; height: 0.7', accent, `${x} 0.75 ${z}`, `0 ${-angle * 57.3} 0`, null, 0.55);
        }
      } else if (def.profile === 'blades') {
        addWireframePart(root, 'primitive: box; width: 2.6; height: 0.1; depth: 0.4', accent, '0 0 0', '0 0 25', `${size} 1 ${size}`, 0.55);

      } else if (def.profile === 'spear') {

      } else if (def.profile === 'hex') {
        for (let i = 0; i < 6; i++) {
          const angle = (Math.PI * 2 * i) / 6;
          const x = Math.cos(angle) * 1.5;
          const z = Math.sin(angle) * 1.5;
          addWireframePart(root, 'primitive: box; width: 0.3; height: 0.3; depth: 0.6', accent, `${x} 0 ${z}`, `0 ${-angle * 57.3} 0`, null, 0.55);
        }
        addWireframePart(root, 'primitive: torus; radius: 1.7; radiusTubular: 0.05', accent, '0 0 0', '90 0 0', `${size} ${size} ${size}`, 0.55);
      } else if (def.profile === 'titan') {
        addWireframePart(root, 'primitive: torusKnot; radius: 1; radiusTubular: 0.08; p: 2; q: 3', accent, '0 0 0', '0 0 0', `${size} ${size} ${size}`, 0.45);
        addWireframePart(root, 'primitive: box; width: 0.5; height: 2.2; depth: 0.5', accent, '-1.3 0 0', null, `${size} ${size} ${size}`, 0.5);
        addWireframePart(root, 'primitive: box; width: 0.5; height: 2.2; depth: 0.5', accent, '1.3 0 0', null, `${size} ${size} ${size}`, 0.5);
      }
      return root;
    }

      bindInputs() {

          if (e.key === 'b' || e.key === 'B') this.useBomb();

        });
        window.addEventListener('keyup', (e) => {
          this.updateDesktopMoveKey(e.key, false);
        });
        if (this.rightHand) {
          this.rightHand.addEventListener('abuttondown', () => this.cycleWeapon('right'));
          this.rightHand.addEventListener('bbuttondown', () => this.cycleWeapon('right'));
        }
        if (this.leftHand) {
          this.leftHand.addEventListener('xbuttondown', () => this.cycleWeapon('left'));
          this.leftHand.addEventListener('ybuttondown', () => this.cycleWeapon('left'));
        }
      },
      updateDesktopMoveKey(key, isDown) {
        if (!this.desktopMove) return;
        if (key === 'a' || key === 'A' || key === 'ArrowLeft') this.desktopMove.left = isDown;
        if (key === 'd' || key === 'D' || key === 'ArrowRight') this.desktopMove.right = isDown;
        if (key === 'w' || key === 'W' || key === 'ArrowUp') this.desktopMove.forward = isDown;
        if (key === 's' || key === 'S' || key === 'ArrowDown') this.desktopMove.back = isDown;
      },
      setupDesktopControls() {
        const prefersDesktop = !navigator.xr;
        if (prefersDesktop) this.enableDesktopMode(false);
        const scene = this.scene;
        const canvas = scene ? scene.canvas : null;
        if (!canvas) return;
        const lockChange = () => {
          this.pointerLocked = document.pointerLockElement === canvas;
          if (!this.pointerLocked) this.setFireHeld('right', false);
        };
        document.addEventListener('pointerlockchange', lockChange);
        canvas.addEventListener('mousedown', (e) => {
          if (!this.desktopMode) return;
          if (!this.pointerLocked) {
            canvas.requestPointerLock();
          }
          if (e.button === 0) {
            this.setFireHeld('right', true);
            this.requestFire('right');
          }
        });
        window.addEventListener('mouseup', (e) => {
          if (!this.desktopMode) return;
          if (e.button === 0) this.setFireHeld('right', false);
        });
        window.addEventListener('mousemove', (e) => {
          if (!this.desktopMode || !this.pointerLocked) return;
          // Invert mouse directions for desktop mode
          this.desktopYaw -= e.movementX * 0.12;
          // Invert vertical movement (mouse up moves view down)
          this.desktopPitch = clamp(this.desktopPitch - e.movementY * 0.1, -60, 60);
          if (this.rig && this.rig.object3D) {
            this.rig.object3D.rotation.set(
              THREE.MathUtils.degToRad(this.desktopPitch),
              THREE.MathUtils.degToRad(this.desktopYaw),
              0
            );
          }
        });
      },
      updateDesktopMovement(dt) {
        if (!this.desktopMode || !this.rig || !this.rig.object3D) return;
        const moveX = (this.desktopMove.right ? 1 : 0) - (this.desktopMove.left ? 1 : 0);
        const moveZ = (this.desktopMove.back ? 1 : 0) - (this.desktopMove.forward ? 1 : 0);
        if (moveX === 0 && moveZ === 0) return;
        const speed = this.desktopMoveSpeed || 4.2;
        const dtSec = (dt || 0) / 1000;
        const pos = this.rig.object3D.position;
        pos.x = clamp(pos.x + moveX * speed * dtSec, -this.desktopBounds.x, this.desktopBounds.x);
        pos.z = clamp(pos.z + moveZ * speed * dtSec, -this.desktopBounds.z, this.desktopBounds.z);
      },
      bindModeButtons() {
        if (this.modeButtons.desktop) {
          this.modeButtons.desktop.addEventListener('click', () => {
            this.enterDesktopPlay('normal');
          });
        }
        if (this.modeButtons.vr) {
          this.modeButtons.vr.addEventListener('click', () => {
            this.desktopMode = false;
            this.setFireHeld('right', false);
            this.setFireHeld('left', false);
            if (document.pointerLockElement) document.exitPointerLock();
            this.resetGame('normal');

      enterDesktopPlay(diff = 'normal') {
        this.enableDesktopMode(true);

        if (canvas) canvas.requestPointerLock();
      },
      enableDesktopMode(force = false) {
        if (this.desktopMode && !force) return;
        this.desktopMode = true;
        this.pointerLocked = false;
        this.desktopYaw = 0;
        this.desktopPitch = 0;
        if (this.rig && this.rig.object3D) {
          const rot = this.rig.object3D.rotation;
          this.desktopYaw = THREE.MathUtils.radToDeg(rot.y);
          this.desktopPitch = THREE.MathUtils.radToDeg(rot.x);
        }
      },
      setFireHeld(hand, state) {
        this.fireHeld[hand] = state;
      },
      cycleWeapon(hand) {
        if (hand === 'left') {
          if (this.handState[hand]) this.handState[hand].weapon = 'capture';
          this.updateHUD();
          return;
        }
        const weapons = this.collectedWeapons.filter(w => w !== 'capture');
        const current = (this.handState[hand] && this.handState[hand].weapon) || 'blaster';
        const idx = weapons.indexOf(current);
        const next = weapons[(idx + 1) % weapons.length] || 'blaster';
        if (this.handState[hand]) this.handState[hand].weapon = next;
        this.updateHUD();
      },
      updateHUD() {
        const lineEl = document.getElementById('hud-line');
        if (lineEl) lineEl.setAttribute('value', '');
        this.renderHudCanvas();
      },
      refreshHudTexture(planeEl) {
        if (!planeEl) return;
        const mesh = planeEl.getObject3D('mesh');
        if (mesh && mesh.material && mesh.material.map) {
          mesh.material.map.needsUpdate = true;
        }
      },
      renderHudCanvas() {
        const ctx = this.hudCtx;
        if (!ctx) return;
        const w = ctx.canvas.width;
        const h = ctx.canvas.height;
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = 'rgba(8, 16, 30, 0.75)';
        ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = '#5ad1ff';
        ctx.lineWidth = 3;
        ctx.strokeRect(8, 8, w - 16, h - 16);

        ctx.fillStyle = '#d8f2ff';
        ctx.font = 'bold 32px Trebuchet MS, Segoe UI, sans-serif';
        ctx.fillText('SYSTEM HUD', 24, 42);

        ctx.fillStyle = '#ffb347';
        ctx.font = 'bold 44px Trebuchet MS, Segoe UI, sans-serif';
        const scoreStr = this.score.toString().padStart(6, '0');
        ctx.fillText(`SCORE ${scoreStr}`, 24, 96);
        ctx.fillStyle = '#9fe3ff';
        ctx.font = 'bold 28px Trebuchet MS, Segoe UI, sans-serif';
        ctx.fillText(`WAVE ${this.wave || 1}`, 520, 52);

        ctx.fillStyle = '#5ad1ff';
        ctx.font = 'bold 32px Trebuchet MS, Segoe UI, sans-serif';
        ctx.fillText(`LIVES x${this.lives}`, 24, 144);
        ctx.fillStyle = '#7df3ff';
        ctx.fillText(`SHIELD ${this.shieldHP}`, 24, 188);

        const rightWeapon = this.handState && this.handState.right ? weaponLabel(this.handState.right.weapon) : 'Blaster';
        const leftWeapon = this.handState && this.handState.left ? weaponLabel(this.handState.left.weapon) : 'Capture';
        ctx.fillStyle = '#ffcc55';
        ctx.fillText(`RIGHT: ${rightWeapon}`, 520, 96);
        ctx.fillStyle = '#9fe3ff';
        ctx.fillText(`LEFT: ${leftWeapon}`, 520, 144);

        ctx.fillStyle = '#d8f2ff';
        ctx.font = 'bold 24px Trebuchet MS, Segoe UI, sans-serif';
        ctx.fillText('POWERUP LEGEND', 24, 236);
        ctx.font = '22px Trebuchet MS, Segoe UI, sans-serif';
        let x = 24;
        let y = 268;
        POWERUP_LEGEND.forEach((key, idx) => {
          const def = POWERUP_DEFS[key];
          if (!def) return;
          const label = def.label || key;
          ctx.fillStyle = def.color || '#d8f2ff';
          ctx.fillText(label, x, y);
          x += ctx.measureText(label).width + 24;
          if (x > w - 180) {
            x = 24;
            y += 28;
          }
        });
        this.refreshHudTexture(this.hudPlane);
      },
      addScore(base, reason = 'hit') {
        this.incrementCombo(reason);
        const gain = Math.round(base * this.comboMultiplier);
        this.score += gain;
        this.updateHUD();

      incrementCombo(reason = 'hit') {
        const now = performance.now();
        if (now - this.lastComboTime > this.comboWindow) {
          this.comboCount = 0;
        }
        this.comboCount += 1;
        this.lastComboTime = now;
        this.comboMultiplier = Math.min(4, 1 + Math.floor(this.comboCount / 3) * 0.5);
        this.updateHUD();
      },
      resetCombo() {
        this.comboCount = 0;
        this.comboMultiplier = 1;
        this.lastComboTime = performance.now();
        this.updateHUD();
      },
      setDifficulty(key) {

        this.moveSpeed = def.moveSpeed;
        this.dropDistance = def.dropDistance;
        this.fireChanceBase = def.fireChance;
        this.fireWave = def.fireWave;
        this.baseTick = def.baseTick;
        this.minTick = def.minTick;
        this.tickStep = def.tickStep;
        this.enemyFireInterval = def.enemyFireInterval || 2200;

        this.enemyFireWaveStep = def.enemyFireWaveStep || this.enemyFireWaveStep;
      },
      resetGame(diffKey) {
        this.state = 'playing';
        this.score = 0;
        this.weaponLevel = 1;
        this.weaponType = 'blaster';
        this.fireDelayBoost = 0;
        this.powerups = [];

        this.bulletTimeUntil = 0;
        this.overclockUntil = 0;
        this.magnetUntil = 0;
        this.handState = { right: { unlocked: true, weapon: 'blaster' }, left: { unlocked: true, weapon: 'capture' } };
        this.shieldHP = 6;
        this.lives = 3;
        this.comboCount = 0;
        this.comboMultiplier = 1;
        this.lastComboTime = 0;
        const defKey = diffKey || 'easy';
        this.startTime = performance.now();
        if (this.shieldComp) this.shieldComp.setHealth(this.shieldHP);
        this.direction = 1;
        this.lastShot = { right: 0, left: 0 };
        this.wave = 1;
        this.bossCount = 0;
        this.bossRewardIndex = 0;
        this.availableBossRewards = [...BOSS_REWARDS];
        this.enemyVolley = 1;
        this.inBossFight = false;
        this.mothership = null;
        this.ufoSpawnedThisWave = 0;
        this.setDifficulty(defKey);
        const def = this.difficulties[defKey] || {};
        this.enemyFireInterval = def.enemyFireInterval || this.enemyFireInterval;
        this.enemyFireMin = def.enemyFireMin || this.enemyFireMin;
        this.nextEnemyFire = performance.now() + this.enemyFireInterval;
        this.clearEntities();
        this.spawnFormation();
        this.hideMenu();
        this.nextMoveAt = performance.now() + this.baseTick;
        this.ufo = null;
        if (this.leftGunContainer) this.leftGunContainer.setAttribute('visible', true);
        this.updateHUD();
      },
      hideMenu() {
        const menu = document.querySelector('#menu');
        if (menu) menu.setAttribute('visible', false);
      },
      showMenu() {
        const menu = document.querySelector('#menu');
        if (menu) menu.setAttribute('visible', true);
      },
      hideBossHud() {
        return;
      },
      clearEntities() {
        [...this.invaders, ...this.playerBullets, ...this.enemyBullets].forEach(obj => {
          if (obj.el && obj.el.parentNode) obj.el.parentNode.removeChild(obj.el);
        });
        this.invaders = [];
        this.playerBullets = [];
        this.enemyBullets = [];
        if (this.powerups && this.powerups.length) {
          this.powerups.forEach(p => p.el && p.el.parentNode && p.el.parentNode.removeChild(p.el));
        }
        this.powerups = [];
        if (this.ufo && this.ufo.el && this.ufo.el.parentNode) {
          this.ufo.el.parentNode.removeChild(this.ufo.el);
        }
        this.ufo = null;
        if (this.mothership && this.mothership.el && this.mothership.el.parentNode) {
          this.mothership.el.parentNode.removeChild(this.mothership.el);
        }
        this.mothership = null;
        this.inBossFight = false;
      },
      spawnFormation() {
        this.direction = 1;
        this.ufoSpawnedThisWave = 0;
        const rows = 5;
        const cols = 8;
        const xGap = 1.6;
        const yGap = 1.05;
        const startZ = -24;
        const startY = 8.2;
        this.formRows = rows;
        this.formStartY = startY;
        this.formYGap = yGap;
        const offsetX = (cols - 1) * xGap * 0.5;
        this.formationX = 0;
        this.formationZ = startZ;
        this.formationDir = 1;
        this.formationBounds = 9;
        this.formationWavePhase = 0;
        this.formationMinX = -offsetX;
        this.formationMaxX = offsetX;
        this.nextDiveAt = performance.now() + 1800;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const type = r === 0 ? 'squid' : r === rows - 1 ? 'bug' : 'crab';
            const invader = createWireframeInvader(type);
            invader.setAttribute('position', `${c * xGap - offsetX} ${startY - r * yGap} ${startZ}`);
            this.scene.appendChild(invader);
            this.invaders.push({
              el: invader,
              type,
              row: r,
              col: c,
              formX: c * xGap - offsetX,
              formY: startY - r * yGap,
              formZ: 0,
              bobPhase: Math.random() * Math.PI * 2,
              state: 'formation'
            });
          }
        }
        const base = this.enemyFireInterval || 2600;

      requestFire(hand = 'right') {

      updatePowerups(dt) {
        if (!this.powerups.length) return;
        const now = performance.now();
        const removeIdx = [];
        for (let i = 0; i < this.powerups.length; i++) {
          const p = this.powerups[i];
          if (!p.el) {
            removeIdx.push(i);
            continue;
          }
          const pos = p.el.object3D.position;
          if (this.magnetUntil && now < this.magnetUntil) {
            const pull = this.headPos.clone().sub(pos).multiplyScalar(0.15);
            p.velocity.x += pull.x * (dt / 1000);
            p.velocity.y += pull.y * (dt / 1000);
            p.velocity.z += pull.z * (dt / 1000);
          }
          pos.x += p.velocity.x * (dt / 1000);
          pos.y += p.velocity.y * (dt / 1000);
          pos.z += p.velocity.z * (dt / 1000);
          p.el.object3D.rotation.y += (p.spin || 0.6) * (dt / 1000);
          if (pos.z > 10 || pos.y < -2 || Math.abs(pos.x) > 30) {
            removeIdx.push(i);
            continue;
          }
        }
        removeIdx.sort((a, b) => b - a).forEach(idx => {
          const p = this.powerups[idx];
          if (p && p.el && p.el.parentNode) p.el.parentNode.removeChild(p.el);

          this.weaponType = def.weapon;
          if (this.handState && this.handState.right) this.handState.right.weapon = def.weapon;

        } else if (type === 'shield') {
          this.shieldHP = Math.max(this.shieldHP, 6);
          if (this.shieldComp) this.shieldComp.setHealth(this.shieldHP);
        } else if (type === 'shieldBoost') {
          this.shieldHP = Math.min(10, this.shieldHP + 3);

            velocity: dir,
            born: now,
            wobble: opts.wobble || 0,
            owner: 'mothership',
            color: opts.color || accent
          };
          if (opts.splitAt) payload.splitAt = opts.splitAt;
          if (opts.splitCount) payload.splitCount = opts.splitCount;
          if (opts.mine) payload.mine = true;
          this.enemyBullets.push(payload);
        };
        if (weapon === 'sweep') {
          const lanes = 7;
          const dirSign = this.mothership.sweepDir || 1;
          for (let i = 0; i < lanes; i++) {
            const offset = (i - (lanes - 1) * 0.5) * 0.8 * dirSign;
            const pos = msPos.clone().add(new THREE.Vector3(offset, -0.3, 0));
            const dir = applyBossAimBias(new THREE.Vector3(dirSign * 0.6, -0.05, 1)).multiplyScalar(baseSpeed * 0.9);
            spawnBullet(pos, dir, { color: accent, radius: 0.16, wobble: 0.0025 + stage * 0.0008 });
          }
          this.mothership.sweepDir = -dirSign;
        } else if (weapon === 'spiral') {
          const shots = 10;
          const baseAngle = (this.mothership.weaponPhase || 0) + 0.6;
          this.mothership.weaponPhase = baseAngle;
          for (let i = 0; i < shots; i++) {
            const angle = baseAngle + (Math.PI * 2 * i) / shots;
            const dir = applyBossAimBias(new THREE.Vector3(Math.cos(angle), Math.sin(angle) * 0.3, 1)).multiplyScalar(baseSpeed * 0.85);
            spawnBullet(msPos.clone(), dir, { color: accent, radius: 0.18, wobble: 0.004 + stage * 0.0008 });
          }
        } else if (weapon === 'fan') {
          const shots = 9 + Math.min(4, stage);
          for (let i = 0; i < shots; i++) {
            const t = shots === 1 ? 0 : i / (shots - 1);
            const angle = THREE.MathUtils.lerp(-0.7, 0.7, t);
            const dir = applyBossAimBias(new THREE.Vector3(Math.sin(angle), Math.sin(angle * 0.5) * 0.2, 1)).multiplyScalar(baseSpeed * 0.95);
            spawnBullet(msPos.clone(), dir, { color: accent, radius: 0.16, wobble: 0.003 + stage * 0.0006 });
          }
        } else if (weapon === 'ring') {
          const shots = 12 + stage;
          for (let i = 0; i < shots; i++) {
            const angle = (Math.PI * 2 * i) / shots;
            const dir = applyBossAimBias(new THREE.Vector3(Math.cos(angle), Math.sin(angle) * 0.35, 1)).multiplyScalar(baseSpeed * 0.75);
            spawnBullet(msPos.clone(), dir, { color: accent, radius: 0.17, wobble: 0.002 + stage * 0.0005 });
          }
        } else if (weapon === 'mine') {
          const mines = 4 + Math.min(3, stage);
          for (let i = 0; i < mines; i++) {
            const offset = (i - (mines - 1) * 0.5) * 0.8;
            const pos = msPos.clone().add(new THREE.Vector3(offset, -0.5, 0));
            const dir = new THREE.Vector3(0, -0.1 - Math.random() * 0.2, 1).normalize().multiplyScalar(2.8 + stage * 0.2);
            spawnBullet(pos, dir, { color: body, radius: 0.22, wobble: 0.001, mine: true, opacity: 0.7 });
          }
        } else if (weapon === 'split') {
          const shots = 3 + Math.min(2, stage);
          for (let i = 0; i < shots; i++) {
            const offset = (i - (shots - 1) * 0.5) * 0.4;
            const pos = msPos.clone().add(new THREE.Vector3(offset, -0.4, 0));
            const dir = applyBossAimBias(this.headPos.clone().sub(pos).normalize()).multiplyScalar(baseSpeed * 0.9);
            dir.x += (Math.random() - 0.5) * 0.2;
            spawnBullet(pos, dir, { color: accent, radius: 0.17, splitAt: now + 700, splitCount: 3, wobble: 0.003 + stage * 0.0005 });
          }
        } else if (weapon === 'rail') {
          const shots = 1 + Math.min(1, Math.floor(stage / 3));
          for (let i = 0; i < shots; i++) {
            const offset = (i - (shots - 1) * 0.5) * 0.5;
            const pos = msPos.clone().add(new THREE.Vector3(offset, -0.2, 0));
            const dir = applyBossAimBias(this.headPos.clone().sub(pos).normalize()).multiplyScalar(baseSpeed * 1.7);
            spawnBullet(pos, dir, { color: accent, radius: 0.14, wobble: 0.001 + stage * 0.0004 });
          }
        } else if (weapon === 'chaos') {
          const burstShots = 4 + Math.min(4, stage);
          for (let i = 0; i < burstShots; i++) {
            const pos = msPos.clone().add(new THREE.Vector3((Math.random() - 0.5) * 0.8, -0.3, 0));
            const dir = applyBossAimBias(this.headPos.clone().sub(pos).normalize());
            dir.x += (Math.random() - 0.5) * 0.6;
            dir.y += (Math.random() - 0.5) * 0.4;
            dir.normalize().multiplyScalar(baseSpeed * 1.05);
            spawnBullet(pos, dir, { color: accent, radius: 0.18, wobble: 0.004 + stage * 0.0007 });
          }
          const ringShots = 8 + stage;
          for (let i = 0; i < ringShots; i++) {
            const angle = (Math.PI * 2 * i) / ringShots;
            const dir = applyBossAimBias(new THREE.Vector3(Math.cos(angle), Math.sin(angle) * 0.3, 1)).multiplyScalar(baseSpeed * 0.8);
            spawnBullet(msPos.clone(), dir, { color: body, radius: 0.15, wobble: 0.0025 });
          }
        } else {
          const volleys = 2 + stage;
          for (let i = 0; i < volleys; i++) {
            const pos = msPos.clone().add(new THREE.Vector3((i - (volleys - 1) * 0.5) * 0.6, -0.4, 0));
            const dir = applyBossAimBias(this.headPos.clone().sub(pos).normalize());
            dir.x += (Math.random() - 0.5) * 0.4 * (1 + stage * 0.25);
            dir.y += (Math.random() - 0.5) * 0.3;
            dir.normalize().multiplyScalar(baseSpeed);
            spawnBullet(pos, dir, { color: accent, radius: 0.2, wobble: 0.003 + stage * 0.001 });
          }
        }
      },
      updateMothership(time, dt) {
        if (!this.mothership || !this.mothership.el) return;
        const now = performance.now();
        const def = this.mothership.def || {};
        const baseY = 8 + this.mothership.stage * 0.12;
        const baseZ = -20;
        const phase = this.mothership.phase || 0;
        let x = 0;
        let y = baseY;
        let z = baseZ;
        if (def.motion === 'wide') {
          x = Math.sin(time * 0.0011 + phase) * (3.4 + this.mothership.stage * 0.25);
          z = baseZ + Math.sin(time * 0.0009 + phase) * 2.2;
          y = baseY + Math.sin(time * 0.0008 + phase) * 0.7;
        } else if (def.motion === 'orbit') {
          const radius = 2.4 + this.mothership.stage * 0.2;
          x = Math.cos(time * 0.0009 + phase) * radius;
          z = baseZ + Math.sin(time * 0.0009 + phase) * radius;
          y = baseY + Math.sin(time * 0.0012 + phase) * 0.8;
        } else if (def.motion === 'hover') {
          x = Math.sin(time * 0.0014 + phase) * 1.6;
          y = baseY + Math.sin(time * 0.0011 + phase) * 1.0;
          z = baseZ + Math.sin(time * 0.0007 + phase) * 1.2;
        } else if (def.motion === 'zigzag') {
          x = Math.sin(time * 0.0017 + phase) * (2.6 + this.mothership.stage * 0.2);
          z = baseZ + Math.sign(Math.sin(time * 0.0011 + phase)) * 1.6;
          y = baseY + Math.cos(time * 0.0013 + phase) * 0.6;
        } else if (def.motion === 'dash') {
          x = Math.sin(time * 0.0022 + phase) * (3.2 + this.mothership.stage * 0.25);
          z = baseZ + Math.sin(time * 0.0016 + phase * 1.3) * 2.8;
          y = baseY + Math.cos(time * 0.0018 + phase) * 0.7;
        } else if (def.motion === 'figure8') {
          const a = Math.sin(time * 0.0014 + phase);
          const b = Math.sin(time * 0.0007 + phase);
          x = a * (3.1 + this.mothership.stage * 0.2);
          z = baseZ + b * a * 3;
          y = baseY + Math.cos(time * 0.001 + phase) * 0.6;
        } else {
          x = Math.sin(time * 0.0011 + phase) * (2 + this.mothership.stage * 0.2);
          y = baseY + Math.sin(time * 0.0008 + phase * 0.8) * 0.8;
          z = baseZ + Math.sin(time * 0.0009 + phase) * 1.5;
        }
        this.mothership.el.object3D.position.set(x, y, z);
        if (now >= this.mothership.nextDrop) {
          this.dropInvaderFromMothership();
          this.mothership.nextDrop = now + this.mothership.dropInterval + Math.random() * 500;
        }
        if (now >= this.mothership.nextWeapon) {
          this.fireMothershipWeapon(now);
          const interval = Math.max(900, this.mothership.weaponInterval - this.bossCount * 80);
          this.mothership.nextWeapon = now + interval + Math.random() * 300;
        }
      },
      checkMothershipHit(pos) {
        if (!this.mothership || !this.mothership.targets || this.mothership.targets.length === 0) return false;
        const target = this.mothership.targets[this.mothership.targetIndex];
        if (!target || !target.el) return false;
        const tPos = target.el.object3D.getWorldPosition(new THREE.Vector3());
        const radius = parseFloat(target.el.getAttribute('radius')) || 0.25;
        if (pos.distanceTo(tPos) < radius + 0.35) {
          this.damageMothership(2, tPos);
          return true;
        }
        return false;
      },
      applyBossReward(type) {
        const key = (type || '').toString();
        if (key === 'dual') {
          this.applyUfoReward('dual');
        } else if (key === 'shieldBoost') {
          this.shieldHP = Math.max(this.shieldHP, 6 + Math.min(4, this.bossCount));
          if (this.shieldComp) this.shieldComp.setHealth(this.shieldHP);
        } else if (key === 'weaponUp') {
          this.weaponLevel = clamp(this.weaponLevel + 1, 1, 6);
        } else if (key === 'extraLife') {
          this.lives = Math.min(6, this.lives + 1);
        } else if (key.startsWith('overclock')) {
          this.fireDelayBoost = (this.fireDelayBoost || 0) + 25;
        }
        this.updateHUD();
      },
      areaDamage(center, radius, level = 1) {
        const hits = [];
        this.invaders.forEach((inv, idx) => {
          const invPos = inv.el.object3D.position.clone();
          if (invPos.distanceTo(center) <= radius) hits.push({ idx, pos: invPos });
        });
        hits.sort((a, b) => b.idx - a.idx).forEach(hit => {
          this.removeInvader(hit.idx);
        });
        this.spawnShockwave(center, level, WEAPON_COLORS.blaster);
      },
      applyUfoReward(type) {
        if (type === 'shield') {
          this.shieldHP = 6;
          if (this.shieldComp) this.shieldComp.setHealth(this.shieldHP);
        } else if (type === 'dual') {
          this.handState.left.unlocked = true;
          if (this.leftGunContainer) this.leftGunContainer.setAttribute('visible', true);
        } else {
          // weapon level up
          this.weaponLevel = clamp(this.weaponLevel + 1, 1, 5);
        }
        this.updateHUD();
      },
      removeInvader(idx) {
        const inv = this.invaders[idx];
        if (!inv) return;
        const dropPos = inv.el ? inv.el.object3D.position.clone() : null;
        if (inv.el && inv.el.parentNode) inv.el.parentNode.removeChild(inv.el);
        this.invaders.splice(idx, 1);
        this.addScore(100, 'invader');
        this.compressRows();
      },
      compressRows() {
        if (!this.invaders.length) return;
        const rows = {};
        this.invaders.forEach(inv => {
          if (!rows[inv.row]) rows[inv.row] = [];
          rows[inv.row].push(inv);
        });
        let target = (this.formRows || 5) - 1;
        for (let i = target; i >= 0; i--) {
          if (rows[i] && rows[i].length) {
            const newRow = target;
            if (newRow !== i) {
              rows[i].forEach(inv => {
                inv.row = newRow;
                inv.formY = this.formStartY - newRow * this.formYGap;
                inv.el.object3D.position.y = inv.formY;
              });
            }
            target--;
          }
        }
      },
      getFormationPosition(inv, time) {
        const waveX = Math.sin(time * 0.0014 + inv.col * 0.6) * 0.35;
        const waveY = Math.cos(time * 0.0016 + inv.row * 0.7) * 0.25;
        const waveZ = Math.sin(time * 0.0012 + inv.col * 0.4) * 0.4;
        return new THREE.Vector3(
          inv.formX + this.formationX + waveX,
          inv.formY + waveY + Math.sin(time * 0.002 + inv.bobPhase) * 0.15,
          this.formationZ + inv.formZ + waveZ
        );
      },
      startDive(inv, time, startPos, aggressive = false) {
        const origin = startPos ? startPos.clone() : this.getFormationPosition(inv, time);
        const spread = aggressive ? 3.2 : 2.2;
        const targetX = clamp(this.headPos.x + (Math.random() - 0.5) * spread, -7, 7);
        const target = new THREE.Vector3(targetX, 1.2 + Math.random() * 0.6, aggressive ? 2.2 : 1.2);
        const ctrl1 = origin.clone().add(new THREE.Vector3((Math.random() - 0.5) * 2.4, -2.2, 5.2));
        const ctrl2 = target.clone().add(new THREE.Vector3((Math.random() - 0.5) * 2.0, 2.0, -3.8));
        const baseDur = 3200 + Math.random() * 900;
        const speedup = Math.min(500, Math.max(0, (this.wave - 1) * 40));
        const elite = aggressive || inv.row === 0 || inv.type === 'squid';
        inv.state = 'dive';
        inv.dive = {
          start: origin,
          ctrl1,
          ctrl2,
          target,
          startTime: time,
          duration: Math.max(2200, baseDur - speedup),
          returnDuration: 2200 + Math.random() * 700,
          canShoot: elite,
          nextShot: time + (elite ? 500 : 900) + Math.random() * 400,
          shotsRemaining: elite ? 3 : 1
        };
      },
      updateDive(inv, time) {
        if (!inv.dive || !inv.el) return false;
        if (inv.state === 'dive') {
          const t = clamp((time - inv.dive.startTime) / inv.dive.duration, 0, 1);
          const pos = cubicBezier(inv.dive.start, inv.dive.ctrl1, inv.dive.ctrl2, inv.dive.target, t);
          inv.el.object3D.position.copy(pos);
          if (inv.dive.canShoot && inv.dive.shotsRemaining > 0 && time >= inv.dive.nextShot) {
            this.spawnEnemyBullet(inv, { speedBoost: 2.2, vertical: -0.2, wobble: 0.002 });
            inv.dive.shotsRemaining -= 1;
            inv.dive.nextShot = time + 520 + Math.random() * 320;
          }
          if (t >= 1) {
            inv.state = 'return';
            inv.returnStart = time;
            inv.returnFrom = pos.clone();
          }
          return true;
        }
        if (inv.state === 'return') {
          const t = clamp((time - inv.returnStart) / inv.dive.returnDuration, 0, 1);
          const formationPos = this.getFormationPosition(inv, time);
          const pos = inv.returnFrom.clone().lerp(formationPos, t);
          inv.el.object3D.position.copy(pos);
          if (t >= 1) {
            inv.state = 'formation';
            inv.dive = null;
            inv.returnFrom = null;
          }
          return true;
        }
        return false;
      },
      maybeLaunchDive(time) {
        if (this.inBossFight || !this.invaders.length) return;
        if (time < this.nextDiveAt) return;
        const active = this.invaders.filter(inv => inv.state === 'dive' || inv.state === 'return').length;
        const maxDives = Math.min(4, 1 + Math.floor(this.wave / 3));
        if (active >= maxDives) {
          this.nextDiveAt = time + 700;
          return;
        }
        const candidates = this.invaders.filter(inv => inv.state === 'formation' && !inv.dropped && inv.row <= 2);
        if (!candidates.length) return;
        const inv = randomChoice(candidates);
        this.startDive(inv, time);
        this.nextDiveAt = time + Math.max(600, 1800 - this.wave * 80);
      },
      handlePlayerHit() {
        if (this.state !== 'playing') return;
        this.lives = Math.max(0, this.lives - 1);
        this.resetCombo();
        this.shieldHP = 0;
        if (this.shieldComp) this.shieldComp.setHealth(this.shieldHP);
        this.weaponLevel = 1;
        this.weaponType = 'blaster';
        this.collectedWeapons = ['blaster'];
        this.fireDelayBoost = 0;
        if (this.handState && this.handState.right) this.handState.right.weapon = 'blaster';
        if (this.handState && this.handState.left) this.handState.left.weapon = 'capture';
        this.enemyBullets.forEach(b => {
          if (b.el && b.el.parentNode) b.el.parentNode.removeChild(b.el);
        });
        this.enemyBullets = [];
        if (this.lives <= 0) {
          this.gameOver('Out of lives');
          return;
        }
        this.flashDamage();
        this.spawnShockwave(this.headPos.clone ? this.headPos.clone() : this.headPos, 1.3, '#ff3355');
        this.playSound('explosion');
        this.updateHUD();
      },
      gameOver(reason) {
        this.state = 'menu';
        this.clearEntities();
        this.showMenu();
        this.resetCombo();
        this.weaponLevel = 1;
        this.weaponType = 'blaster';
        this.collectedWeapons = ['blaster'];
        this.fireDelayBoost = 0;
        if (this.handState && this.handState.right) this.handState.right.weapon = 'blaster';
        if (this.handState && this.handState.left) this.handState.left.weapon = 'capture';
        this.updateHUD();
        console.warn('Game Over:', reason);
      },
      useBomb() {
        return;
      },
      handleMenuHit(bullet, idx) {
        const pos = bullet.el.object3D.position;
        for (const cube of this.menuCubes) {
          const cpos = cube.object3D.getWorldPosition(this.tempVec);
          const size = 0.3;
          if (Math.abs(pos.x - cpos.x) <= size && Math.abs(pos.y - cpos.y) <= size && Math.abs(pos.z - cpos.z) <= size) {
            const difficulty = cube.dataset.difficulty || 'easy';
            this.resetGame(difficulty);
            return true;
          }
        }
        return false;
      },
      tick(time, timeDelta) {
        if (this.state === 'menu') {
          this.updateBullets(timeDelta, true);
          return;
        }
        this.maybeAutoFire(time);
        this.updateDesktopMovement(timeDelta);
        if (this.cameraEl && this.cameraEl.object3D) {
          this.cameraEl.object3D.getWorldPosition(this.headPos);
        }
        if (this.comboCount > 0 && time - this.lastComboTime > this.comboWindow) {
          this.resetCombo();
        }
        this.maybeSpawnUfo(time);
        this.updateMothership(time, timeDelta);
        this.updateInvaders(time, timeDelta);
        this.maybeEnemyFire(time);
        this.updateBullets(timeDelta, false);
        this.updateEnemyBullets(timeDelta);
        this.updatePowerups(timeDelta);
        this.updateCrosshairs();
        this.updateSky(timeDelta);
        this.updateUfo(time);
        if (time - this.lastHudUpdate > 300) {
          this.renderHudCanvas();
          this.lastHudUpdate = time;
        }
      },
      maybeEnemyFire(time) {
        if (this.state !== 'playing') return;
        if (!this.invaders.length) return;
        if (this.freezeMovementUntil && time < this.freezeMovementUntil) return;
        const now = performance.now();
        if (now < this.nextEnemyFire) return;
        const elapsed = this.startTime ? Math.max(0, now - this.startTime) : now;
        const waveStep = this.enemyFireWaveStep || 60;
        const interval = Math.max(this.enemyFireMin || 900,
          (this.enemyFireInterval || 2200)
          - (this.wave - 1) * waveStep
          - Math.min(320, (elapsed / 60000) * 100));
        const inv = randomChoice(this.invaders);
        if (inv) {
          const spread = 0.02 + Math.floor((this.wave - 1) / 5) * 0.01;
          const lateral = (Math.random() - 0.5) * spread;
          const vertical = (Math.random() - 0.5) * spread * 0.6;
          this.spawnEnemyBullet(inv, { lateral, vertical });
        }
        this.nextEnemyFire = now + interval + Math.random() * 140;
      },
      updateInvaders(time, dt) {
        if (this.invaders.length === 0) {
          if (this.state === 'playing') {
            if (!this.inBossFight && this.wave % 5 === 0) {
              this.startMothershipEncounter();
              return;
            }
            if (!this.inBossFight) {
              this.wave += 1;
              this.spawnFormation();
              this.nextMoveAt = time + this.baseTick;
            }
          }
          if (this.inBossFight) return;
        }

        const frozen = this.freezeMovementUntil && time < this.freezeMovementUntil;
        if (!frozen) this.maybeLaunchDive(time);

        const dtSec = (dt || 0) / 1000;
        const leftEdge = -this.formationBounds - this.formationMinX;
        const rightEdge = this.formationBounds - this.formationMaxX;
        let dropped = false;
        if (!frozen) {
          this.formationX += this.formationDir * this.moveSpeed * dtSec * 1.2;
          if (this.formationX > rightEdge) {
            this.formationX = rightEdge;
            this.formationDir = -1;
            this.formationZ += this.dropDistance;
            dropped = true;
          } else if (this.formationX < leftEdge) {
            this.formationX = leftEdge;
            this.formationDir = 1;
            this.formationZ += this.dropDistance;
            dropped = true;
          }
          if (dropped) this.playSound('move');
        }

        this.invaders.forEach(inv => {
          if (!frozen && this.updateDive(inv, time)) return;
          if (frozen) return;
          const pos = this.getFormationPosition(inv, time);
          inv.el.object3D.position.copy(pos);
        });

        if (dropped && this.invaders.some(inv => inv.el && inv.el.object3D.position.z > 1.5)) {
          this.gameOver('Invaders reached you');
        }
      },
      updateBullets(dt, menuMode) {
        const removeIdx = [];
        const enemyRemove = [];
        for (let i = 0; i < this.playerBullets.length; i++) {
          const b = this.playerBullets[i];
          const pos = b.el.object3D.position;
          if (b.kind === 'special' && this.invaders.length) {
            const target = this.invaders.reduce((best, inv) => {
              const p = inv.el.object3D.position;
              const d = pos.distanceTo(p);
              if (!best || d < best.d) return { d, p };
              return best;
            }, null);
            if (target) {
              const desired = target.p.clone().sub(pos).normalize().multiplyScalar(b.velocity.length());
              b.velocity.lerp(desired, 0.08);
            }
          }
          pos.x += b.velocity.x * (dt / 1000);
          pos.y += b.velocity.y * (dt / 1000);
          pos.z += b.velocity.z * (dt / 1000);
          if (pos.z < -60 || pos.z > 5 || Math.abs(pos.x) > 50 || Math.abs(pos.y) > 50) {
            removeIdx.push(i);
            continue;
          }
          if (b.kind === 'capture') {
            for (let p = 0; p < this.powerups.length; p++) {
              const power = this.powerups[p];
              if (!power || !power.el) continue;
              const pPos = power.el.object3D.position;
              const hitDist = (b.radius || 0.12) + 0.35;
              if (pos.distanceTo(pPos) < hitDist) {
                this.applyPowerup(power.type);
                if (power.el.parentNode) power.el.parentNode.removeChild(power.el);
                this.powerups.splice(p, 1);
                removeIdx.push(i);
                break;
              }
            }
            if (removeIdx.includes(i)) continue;
          }
          if (menuMode) {
            if (this.handleMenuHit(b, i)) {
              removeIdx.push(i);
            }
            continue;
          }
          if (b.kind !== 'capture' && this.mothership && this.checkMothershipHit(pos)) {
            removeIdx.push(i);
            continue;
          }
          // Enemy bullet interception
          for (let e = 0; e < this.enemyBullets.length; e++) {
            if (enemyRemove.includes(e)) continue;
            const eb = this.enemyBullets[e];
            const ebPos = eb.el.object3D.position;
            const hitDist = (b.radius || 0.02) + 0.15;
            if (pos.distanceTo(ebPos) < hitDist) {
              enemyRemove.push(e);
              removeIdx.push(i);
              this.addScore(25, 'deflect');
              this.spawnShockwave(ebPos.clone ? ebPos.clone() : ebPos, b.level || 1, '#77ddff');
              break;
            }
          }
          if (removeIdx.includes(i)) continue;
          if (b.kind === 'capture') continue;
          // UFO collision
          if (this.ufo && this.ufo.el) {
            const uPos = this.ufo.el.object3D.position;
            if (pos.distanceTo(uPos) < 1.1) {
              this.addScore(1000, 'ufo');
              const offset = new THREE.Vector3((Math.random() - 0.5) * 0.8, -0.35, (Math.random() - 0.5) * 0.3);
              const dropPos = uPos.clone().add(offset);
              dropPos.x = clamp(dropPos.x, -22, 22);
              const dropVelocity = new THREE.Vector3((Math.random() - 0.5) * 0.02, -0.16, 1.4);
              this.spawnPowerup(pickPowerupType(), dropPos, { radius: 0.4, velocity: dropVelocity, pulse: true });
              this.spawnShockwave(uPos.clone(), 2.4, '#8ad8ff');
              this.emitSparkBurst(uPos.clone(), '#8ad8ff');
              this.playSound('explosion');
              if (this.ufo.el.parentNode) this.ufo.el.parentNode.removeChild(this.ufo.el);
              this.ufo = null;
              removeIdx.push(i);
              this.updateHUD();
              continue;
            }
          }
          // Invader collision
          if (b.kind === 'capture') continue;
          for (let j = 0; j < this.invaders.length; j++) {
            const inv = this.invaders[j];
            const invPos = inv.el.object3D.position.clone();
            if (pos.distanceTo(invPos) < 0.5) {
              this.playSound('explosion');
              this.emitSparkBurst(invPos, '#ff9966');
              this.removeInvader(j);
              if (b.kind === 'nova') {
                this.areaDamage(invPos, 1.8 + (b.level || 1) * 0.2, b.level || 1);
                removeIdx.push(i);
              } else if (b.pierce && b.pierce > 0) {
                b.pierce -= 1;
              } else {
                removeIdx.push(i);
              }
              break;
            }
          }
        }
        // remove bullets
        removeIdx.sort((a, b) => b - a).forEach(idx => {
          const b = this.playerBullets[idx];
          if (b && b.el && b.el.parentNode) b.el.parentNode.removeChild(b.el);
          this.playerBullets.splice(idx, 1);
        });
        enemyRemove.sort((a, b) => b - a).forEach(idx => {
          const eb = this.enemyBullets[idx];
          if (eb && eb.el && eb.el.parentNode) eb.el.parentNode.removeChild(eb.el);
          this.enemyBullets.splice(idx, 1);
        });
      },
      updateEnemyBullets(dt) {
        const removes = [];
        const shieldPos = new THREE.Vector3();
        const now = performance.now();
        const slowFactor = (this.bulletTimeUntil && now < this.bulletTimeUntil) ? 0.45 : 1;
        if (this.shieldEntity && this.shieldEntity.object3D) {
          this.shieldEntity.object3D.getWorldPosition(shieldPos);
        }
        for (let i = 0; i < this.enemyBullets.length; i++) {
          const b = this.enemyBullets[i];
          const pos = b.el.object3D.position;
          if (b.splitAt && now >= b.splitAt && !b.hasSplit) {
            b.hasSplit = true;
            const baseSpeed = b.velocity.length();
            const baseDir = b.velocity.clone().normalize();
            const offsets = [-0.35, 0, 0.35];
            offsets.forEach(offset => {
              const dir = baseDir.clone();
              dir.x += offset;
              dir.y += (Math.random() - 0.5) * 0.2;
              dir.normalize().multiplyScalar(baseSpeed * 0.95);
              const child = createEnemyProjectile(b.color || '#ff66cc', 0.13, 0.75);
              child.object3D.position.copy(pos.clone());
              this.scene.appendChild(child);
              this.enemyBullets.push({
                el: child,
                velocity: dir,
                born: now,
                wobble: b.wobble || 0,
                owner: b.owner || 'mothership',
                color: b.color || '#ff66cc'
              });
            });
            removes.push(i);
            continue;
          }
          if (b.wobble) {
            const wobblePhase = (performance.now() * b.wobble) + i * 0.7;
            const wobbleX = Math.sin(wobblePhase) * 0.35 * (b.owner === 'mothership' ? 1.6 : 1);
            const wobbleY = Math.cos(wobblePhase * 0.9) * 0.22;
            b.velocity.x += wobbleX * (dt / 1000);
            b.velocity.y += wobbleY * (dt / 1000);
            b.velocity.normalize().multiplyScalar(b.velocity.length());
          }
          pos.x += b.velocity.x * (dt / 1000) * slowFactor;
          pos.y += b.velocity.y * (dt / 1000) * slowFactor;
          pos.z += b.velocity.z * (dt / 1000) * slowFactor;
          // Shield interception
          if (this.shieldHP > 0 && pos.distanceTo(shieldPos) < 0.9) {
            this.shieldHP = Math.max(0, this.shieldHP - 1);
            if (this.shieldComp) this.shieldComp.setHealth(this.shieldHP);
            this.playSound('shield');
            this.flashShield(shieldPos.clone ? shieldPos.clone() : shieldPos);
            removes.push(i);
            this.updateHUD();
            continue;
          }
          // Head hit
          if (pos.distanceTo(this.headPos) < 0.5) {
            this.handlePlayerHit();
            removes.push(i);
            continue;
          }
          if (pos.z > 5 || pos.z < -60 || Math.abs(pos.x) > 50 || Math.abs(pos.y) > 50) {
            removes.push(i);
          }
        }
        removes.sort((a, b) => b - a).forEach(idx => {
          const b = this.enemyBullets[idx];
          if (b && b.el && b.el.parentNode) b.el.parentNode.removeChild(b.el);
          this.enemyBullets.splice(idx, 1);
        });
      },
      updateUfo(time) {
        if (!this.ufo || !this.ufo.el) return;
        const t = clamp((time - this.ufoStart) / this.ufo.duration, 0, 1);
        const baseX = THREE.MathUtils.lerp(-22, 22, t);
        const sway = Math.sin(time * 0.0025 + this.ufo.phase) * 0.6;
        const bob = Math.sin(time * 0.003 + this.ufo.phase * 0.5) * 0.35;
        const y = 8.4 + bob;
        const z = -20 + sway;
        this.ufo.el.object3D.position.set(baseX, y, z);
        if (t >= 1) {
          if (this.ufo.el.parentNode) this.ufo.el.parentNode.removeChild(this.ufo.el);
          this.ufo = null;
        }
      },
      updateSky(timeDelta) {
        if (!this.stars) return;
        this.stars.forEach(item => {
          if (!item.el || !item.el.object3D) return;
          const pos = item.el.object3D.position;
          pos.z += item.speed * -timeDelta * 0.05;
          if (pos.z > -5) pos.z = -70;
        });
      },
      updateCrosshairs() {
        if (this.desktopMode && this.cameraEl && this.cameraEl.object3D) {
          const dir = new THREE.Vector3();
          this.cameraEl.object3D.getWorldDirection(dir);
          dir.multiplyScalar(-1);
          const origin = new THREE.Vector3();
          this.cameraEl.object3D.getWorldPosition(origin);
          const pos = origin.clone().add(dir.clone().multiplyScalar(18));
          this.crosshairRight.setAttribute('position', `${pos.x} ${pos.y} ${pos.z}`);
          this.crosshairRight.setAttribute('look-at', '#camera');
          this.crosshairRight.setAttribute('visible', true);
          if (this.crosshairLeft) this.crosshairLeft.setAttribute('visible', false);
          return;
        }
        const targetZ = this.invaders.length
          ? this.invaders.reduce((s, inv) => s + (inv.el ? inv.el.object3D.position.z : -20), 0) / this.invaders.length
          : -20;
        const updateForHand = (hand, crosshair, muzzle, unlocked) => {
          if (!crosshair || !muzzle || (!unlocked && hand === 'left')) {
            if (crosshair) crosshair.setAttribute('visible', false);
            return;
          }
          const dir = new THREE.Vector3();
          muzzle.object3D.getWorldDirection(dir);
          dir.multiplyScalar(-1);
          const origin = new THREE.Vector3();
          muzzle.object3D.getWorldPosition(origin);
          if (Math.abs(dir.z) < 0.001) {
            crosshair.setAttribute('visible', false);
            return;
          }
          const t = (targetZ - origin.z) / dir.z;
          if (t <= 0) {
            crosshair.setAttribute('visible', false);
            return;
          }
          const pos = origin.clone().add(dir.clone().multiplyScalar(t));
          crosshair.setAttribute('position', `${pos.x} ${pos.y} ${pos.z}`);
          crosshair.setAttribute('look-at', '#camera');
          crosshair.setAttribute('visible', true);
        };
        updateForHand('right', this.crosshairRight, this.rightMuzzle, true);
        updateForHand('left', this.crosshairLeft, this.leftMuzzle, this.handState.left.unlocked);
      }
    });
  </script>
