<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas VR Cinema Ultimate</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; }
        #info {
            position: absolute; top: 10px; left: 0; width: 100%;
            text-align: center; color: white; font-family: sans-serif;
            pointer-events: none; text-shadow: 0 0 5px black; z-index: 1;
            background: rgba(0,0,0,0.5); padding: 10px;
        }
        #video-input { display: none; }
        #server-warning {
            position: absolute; bottom: 14px; left: 50%;
            transform: translateX(-50%); padding: 10px 14px;
            background: rgba(0,0,0,0.75); color: #fff; font-family: sans-serif;
            border: 1px solid rgba(255,255,255,0.25); border-radius: 10px;
            z-index: 5; max-width: 90vw; text-align: center; line-height: 1.4;
            display: none;
        }
    </style>
</head>
<body>
    <div id="info">
        <b>Christmas VR Cinema</b><br/>
        TRIGGER: Fire Snow Bullet | RAY: Melt Snow & Click Buttons<br/>
        <i>"Load" opens local file picker (Exits VR on Quest to pick)</i>
    </div>
    
    <input type="file" id="video-input" accept="video/*">
    <div id="server-warning"></div>

    <!-- Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- Configuration ---
        const SNOW_COUNT = 4000;
        const SNOW_RANGE = 50;
        
        // Snowball "Bullet" Physics
        const SNOWBALL_SPEED = 60.0; // Fast!
        const SNOWBALL_GRAVITY = 9.8;
        const SNOWBALL_RADIUS = 0.15;
        const MAX_SNOWBALLS = 150; // Limit to prevent lag when piling
        
        const isFileProtocol = window.location.protocol === 'file:';

        // --- Globals ---
        let camera, scene, renderer;
        let controller1, controller2;
        let controllerGrip1, controllerGrip2;
        let raycaster;
        let dolly; 

        // Audio
        let listener;
        let santaSound;
        
        // Cinema State
        let videoElement, videoTexture, tvGroup, tvMesh;
        let controlPanel;
        let controlsVisible = true;
        
        // Scene State
        const snowSystem = { mesh: null, velocities: [] };
        let thrownSnowballs = []; // Array of objects
        const interactableObjects = []; 
        const floorObjects = [];
        let santaGroup;
        let santaLoaded = false;
        let santaActive = false;
        let santaPassStart = 0;
        const santaPassDuration = 25;
        let santaNextPassTime = 0;
        const santaStartPos = new THREE.Vector3();
        const santaEndPos = new THREE.Vector3();
        const controllerHoverTargets = [null, null];
        let mouseHoverTarget = null;

        // Temps
        const tempVecA = new THREE.Vector3();
        const tempVecB = new THREE.Vector3();
        const tempMatrix = new THREE.Matrix4();
        const tempQuat = new THREE.Quaternion();
        const clock = new THREE.Clock();
        const mouse = new THREE.Vector2();

        // Cursor
        const cursor = new THREE.Mesh(
            new THREE.RingGeometry(0.02, 0.04, 32).rotateX(-Math.PI / 2),
            new THREE.MeshBasicMaterial({ color: 0xff0000, opacity: 0.8, transparent: true })
        );
        
        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020208); // Darker night
            scene.fog = new THREE.FogExp2(0x020208, 0.015);

            dolly = new THREE.Group();
            dolly.position.set(0, 0, 5); 
            scene.add(dolly);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.6, 0);
            dolly.add(camera);

            // Audio Listener for Santa
            listener = new THREE.AudioListener();
            camera.add(listener);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);
            document.body.appendChild(VRButton.createButton(renderer));
            
            // Events
            renderer.domElement.addEventListener('pointerdown', onPointerDown);
            renderer.domElement.addEventListener('pointermove', onPointerMove);
            window.addEventListener('resize', onWindowResize);

            if (isFileProtocol) {
                const warn = document.getElementById('server-warning');
                warn.style.display = 'block';
                warn.innerHTML = "<b>Warning:</b> Running via file:// protocol.<br>Local assets (Santa/Audio) may not load.<br>Use a local web server for best experience.";
            }

            // Scene Building
            createEnvironment();
            createChristmasLights();
            createAdditionalDecorations(); // New Candy Canes/Presents
            createSnowSystem();
            setupSanta();
            
            // Cinema
            createCinemaSystem(0, 2.9, -4);
            setupVideoElement();
            
            // Controllers
            setupControllers();

            raycaster = new THREE.Raycaster();
            scene.add(cursor);

            renderer.setAnimationLoop(render);
        }

        // --- ASSETS & DECOR ---

        function setupSanta() {
            // Audio
            santaSound = new THREE.PositionalAudio(listener);
            const audioLoader = new THREE.AudioLoader();
            audioLoader.load('ho-ho-ho-santa-voice-430649.mp3', function(buffer) {
                santaSound.setBuffer(buffer);
                santaSound.setRefDistance(20);
                santaSound.setVolume(2.0); // Louder source, fades with distance
            }, undefined, () => console.warn("Santa audio not found."));

            // Model
            const loader = new GLTFLoader();
            loader.load('santas_sleigh_ride.glb', (gltf) => {
                santaGroup = gltf.scene;
                santaGroup.scale.set(0.6, 0.6, 0.6);
                santaGroup.add(santaSound); // Attach sound to Santa
                santaGroup.visible = false;
                scene.add(santaGroup);
                santaLoaded = true;
                scheduleNextSantaPass(10); // First pass in 10s
            }, undefined, (err) => {
                console.log('Santa GLB not found, using placeholder box');
                santaGroup = new THREE.Mesh(new THREE.BoxGeometry(2,1,4), new THREE.MeshBasicMaterial({color:0xff0000}));
                santaGroup.add(santaSound);
                santaGroup.visible = false;
                scene.add(santaGroup);
                santaLoaded = true;
                scheduleNextSantaPass(10);
            });
        }

        function createAdditionalDecorations() {
            // Candy Canes and Presents logic
            const caneGeo = new THREE.TorusGeometry(0.3, 0.04, 8, 20, Math.PI);
            const caneStaffGeo = new THREE.CylinderGeometry(0.04, 0.04, 1.5, 8);
            const caneMat = new THREE.MeshStandardMaterial({ color: 0xff0000, roughness: 0.2 });
            const whiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });

            const boxGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
            
            // Random placement around trees (avoid center path)
            for(let i=0; i<20; i++) {
                let x = (Math.random()-0.5) * 40;
                let z = (Math.random()-0.5) * 30;
                // Keep center clear (X: -5 to 5, Z: -10 to 5)
                if (x > -5 && x < 5 && z > -10 && z < 5) continue;

                // Candy Cane
                const caneGroup = new THREE.Group();
                const top = new THREE.Mesh(caneGeo, caneMat);
                top.position.y = 1.5;
                const staff = new THREE.Mesh(caneStaffGeo, whiteMat); // Simplified white staff
                staff.position.y = 0.75;
                staff.position.x = 0.3; // align with hook
                caneGroup.add(top);
                caneGroup.add(staff);
                
                // Add stripes (simple rings)
                for(let r=0; r<5; r++) {
                    const stripe = new THREE.Mesh(new THREE.CylinderGeometry(0.042, 0.042, 0.1, 8), caneMat);
                    stripe.position.y = 0.3 + r*0.3;
                    stripe.position.x = 0.3;
                    caneGroup.add(stripe);
                }

                caneGroup.position.set(x, 0, z);
                caneGroup.rotation.y = Math.random() * Math.PI * 2;
                scene.add(caneGroup);
            }

            // Presents
            for(let i=0; i<15; i++) {
                let x = (Math.random()-0.5) * 30;
                let z = (Math.random()-0.5) * 20;
                if (x > -5 && x < 5 && z > -10 && z < 5) continue;

                const color = new THREE.Color().setHSL(Math.random(), 0.8, 0.5);
                const mat = new THREE.MeshStandardMaterial({ color: color });
                const box = new THREE.Mesh(boxGeo, mat);
                box.position.set(x, 0.25, z);
                box.rotation.y = Math.random();
                box.castShadow = true;
                scene.add(box);
            }
        }

        // --- CINEMA ---

        function setupVideoElement() {
            videoElement = document.createElement('video');
            videoElement.crossOrigin = "anonymous";
            videoElement.loop = false;
            videoElement.style.display = 'none'; 
            // Important for Quest to allow local texture update
            videoElement.setAttribute('webkit-playsinline', 'webkit-playsinline');
            videoElement.setAttribute('playsinline', 'playsinline');

            videoElement.addEventListener('play', () => syncVideoState(true));
            videoElement.addEventListener('pause', () => syncVideoState(false));
            videoElement.addEventListener('ended', () => syncVideoState(false));
            
            videoTexture = new THREE.VideoTexture(videoElement);
            videoTexture.minFilter = THREE.LinearFilter;
            videoTexture.magFilter = THREE.LinearFilter;
            videoTexture.colorSpace = THREE.SRGBColorSpace;

            const input = document.getElementById('video-input');
            input.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const url = URL.createObjectURL(file);
                    videoElement.src = url;
                    videoElement.load();
                    videoElement.play().catch(e => console.log("Play error:", e));
                    // If we were in VR, we might want to ensure controls update
                    syncVideoState(false);
                }
            });
        }

        function createCinemaSystem(x, y, z) {
            tvGroup = new THREE.Group();
            tvGroup.position.set(x, y, z);
            scene.add(tvGroup);

            // Screen
            const geometry = new THREE.PlaneGeometry(4, 2.25);
            const material = new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide });
            tvMesh = new THREE.Mesh(geometry, material);
            tvMesh.name = "tv_screen";
            tvGroup.add(tvMesh);

            // Frame
            const frameGeo = new THREE.BoxGeometry(4.2, 2.45, 0.1);
            const frameMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
            const frame = new THREE.Mesh(frameGeo, frameMat);
            frame.position.z = -0.06;
            tvGroup.add(frame);

            // Control Panel
            controlPanel = new THREE.Group();
            controlPanel.position.set(0, -1.7, 0.2);
            controlPanel.rotation.x = -Math.PI / 6;
            tvGroup.add(controlPanel);

            createButton(controlPanel, -2.1, 0, "LOAD FILE", 0x4444ff, "btn_load");
            createButton(controlPanel, -0.7, 0, "PLAY/PAUSE", 0x44ff44, "btn_play");
            createButton(controlPanel,  0.7, 0, "SIZE -", 0xffaa00, "btn_scale_down");
            createButton(controlPanel,  2.1, 0, "SIZE +", 0xffaa00, "btn_scale_up");
        }

        function createButton(parent, x, y, text, color, name) {
            const geometry = new THREE.BoxGeometry(1.2, 0.6, 0.12);
            const material = new THREE.MeshStandardMaterial({ color: color, emissive: 0x111111, emissiveIntensity: 0.4 });
            const btn = new THREE.Mesh(geometry, material);
            btn.position.set(x, y, 0);
            btn.name = name;
            btn.userData = { baseColor: color, baseEmissive: 0x111111, hovered: false };
            parent.add(btn);
            interactableObjects.push(btn);

            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = color === 0x111111 ? 'white' : 'black';
            ctx.fillRect(0,0,256,128);
            ctx.fillStyle = color === 0x111111 ? 'black' : 'white';
            ctx.font = 'bold 36px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 128, 64);
            
            const tex = new THREE.CanvasTexture(canvas);
            const label = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 0.45), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
            label.position.z = 0.061;
            label.userData = { baseButton: btn, actionName: name };
            btn.add(label);
            interactableObjects.push(label);
        }

        // --- ENVIRONMENT ---

        function createEnvironment() {
            // Ground
            const groundGeo = new THREE.PlaneGeometry(100, 100, 128, 128);
            const pos = groundGeo.attributes.position;
            for(let i=0; i<pos.count; i++){
                pos.setZ(i, getGroundHeight(pos.getX(i), pos.getY(i)));
            }
            groundGeo.computeVertexNormals();
            const groundMat = new THREE.MeshStandardMaterial({ color: 0xeeeeff, roughness: 0.9 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
            floorObjects.push(ground);

            // Trees
            for(let i=0; i<40; i++) {
                let tx = (Math.random()-0.5)*70;
                let tz = (Math.random()-0.5)*70;
                if (tx > -6 && tx < 6 && tz > -12 && tz < 6) continue; // Clear zone
                createTree(tx, tz);
            }

            // Lights
            const ambient = new THREE.AmbientLight(0x404060, 0.6);
            scene.add(ambient);
            const moonLight = new THREE.DirectionalLight(0xaaccff, 0.6);
            moonLight.position.set(10, 20, 10);
            moonLight.castShadow = true;
            moonLight.shadow.mapSize.width = 2048;
            moonLight.shadow.mapSize.height = 2048;
            scene.add(moonLight);
        }

        function createTree(x, z) {
            const group = new THREE.Group();
            group.position.set(x, getGroundHeight(x,z), z);
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.25, 1, 8), new THREE.MeshStandardMaterial({ color: 0x3d2817 }));
            trunk.position.y = 0.5; group.add(trunk);
            const leafMat = new THREE.MeshStandardMaterial({ color: 0x0f5f13 });
            for(let i=0; i<3; i++) {
                const cone = new THREE.Mesh(new THREE.ConeGeometry(1.5 - (i*0.4), 1.5, 8), leafMat);
                cone.position.y = 1.5 + (i * 0.8);
                cone.castShadow = true;
                group.add(cone);
            }
            scene.add(group);
        }

        function getGroundHeight(x, z) {
            return Math.sin(x*0.1)*0.4 + Math.cos(z*0.15)*0.3;
        }

        function createSnowSystem() {
            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            for (let i = 0; i < SNOW_COUNT; i++) {
                vertices.push((Math.random() - 0.5) * SNOW_RANGE);
                vertices.push(Math.random() * 20);
                vertices.push((Math.random() - 0.5) * SNOW_RANGE);
                snowSystem.velocities.push({
                    y: -(0.03 + Math.random() * 0.05),
                    x: (Math.random() - 0.5) * 0.02,
                    z: (Math.random() - 0.5) * 0.02
                });
            }
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            
            const canvas = document.createElement('canvas');
            canvas.width=32; canvas.height=32;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(16,16,10,0,Math.PI*2); ctx.fill();
            const tex = new THREE.CanvasTexture(canvas);

            const material = new THREE.PointsMaterial({
                color: 0xffffff, size: 0.15, map: tex,
                transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false
            });
            snowSystem.mesh = new THREE.Points(geometry, material);
            scene.add(snowSystem.mesh);
        }

        function createChristmasLights() {
            const curve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(-5, 4, -5), new THREE.Vector3(5, 4, -5),
                new THREE.Vector3(5, 4, 5), new THREE.Vector3(-5, 4, 5),
            ], true);
            const points = curve.getPoints(60);
            points.forEach((p, i) => {
                if(i%2===0) {
                    const c = new THREE.Color().setHSL(Math.random(), 1, 0.5);
                    const b = new THREE.Mesh(new THREE.SphereGeometry(0.05), new THREE.MeshBasicMaterial({ color: c }));
                    b.position.copy(p);
                    scene.add(b);
                }
            });
        }

        // --- CONTROLS & PHYSICS ---

        function setupControllers() {
            controller1 = renderer.xr.getController(0);
            controller1.addEventListener('selectstart', onSelectStart);
            dolly.add(controller1);

            controller2 = renderer.xr.getController(1);
            controller2.addEventListener('selectstart', onSelectStart);
            controller2.addEventListener('squeezestart', () => { controlsVisible = !controlsVisible; controlPanel.visible = controlsVisible; });
            dolly.add(controller2);

            const factory = new XRControllerModelFactory();
            controllerGrip1 = renderer.xr.getControllerGrip(0);
            controllerGrip1.add(factory.createControllerModel(controllerGrip1));
            dolly.add(controllerGrip1);

            controllerGrip2 = renderer.xr.getControllerGrip(1);
            controllerGrip2.add(factory.createControllerModel(controllerGrip2));
            dolly.add(controllerGrip2);

            // Ray visual
            const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-1)]);
            const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: 0xff0000, linewidth: 2 }));
            line.name = 'line'; line.scale.z = 100;
            controller1.add(line.clone()); controller2.add(line.clone());
        }

        function onSelectStart(event) {
            const c = event.target;
            
            // Check UI interaction first
            tempMatrix.identity().extractRotation(c.matrixWorld);
            raycaster.ray.origin.setFromMatrixPosition(c.matrixWorld);
            raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);
            
            const hits = raycaster.intersectObjects(interactableObjects, true);
            if (hits.length > 0) {
                const btn = resolveButtonMesh(hits[0].object);
                if(btn) handleButtonAction(btn.name);
                return;
            }

            // Fire Snowball Bullet
            fireSnowball(c);
        }

        function fireSnowball(controller) {
            // Manage max count
            if(thrownSnowballs.length >= MAX_SNOWBALLS) {
                const old = thrownSnowballs.shift();
                scene.remove(old.mesh);
            }

            const snowballMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6, metalness: 0.1 });
            const snowball = new THREE.Mesh(new THREE.SphereGeometry(SNOWBALL_RADIUS, 12, 12), snowballMat);
            snowball.castShadow = true; 
            snowball.receiveShadow = true;

            controller.getWorldPosition(tempVecA);
            controller.getWorldQuaternion(tempQuat);
            const dir = tempVecB.set(0, 0, -1).applyQuaternion(tempQuat).normalize();
            
            // Start slightly in front
            snowball.position.copy(tempVecA).addScaledVector(dir, 0.3);
            
            // Bullet Velocity
            const velocity = dir.clone().multiplyScalar(SNOWBALL_SPEED);

            scene.add(snowball);
            thrownSnowballs.push({
                mesh: snowball,
                vel: velocity,
                radius: SNOWBALL_RADIUS,
                stopped: false,
                scale: 1.0
            });
            
            // "Throw" sound (re-using click generator with pitch shift)
            playSound(600, 200, 0.05);
        }

        function handleButtonAction(name) {
            playSound(300, 800, 0.1); // Click sound
            if(name === 'btn_load') {
                document.getElementById('video-input').click();
            } else if(name === 'btn_play') {
                if(videoElement.paused) videoElement.play(); else videoElement.pause();
            } else if(name === 'btn_scale_up') {
                tvGroup.scale.multiplyScalar(1.1);
            } else if(name === 'btn_scale_down') {
                tvGroup.scale.multiplyScalar(0.9);
            }
        }

        function syncVideoState(playing) {
            controlsVisible = !playing;
            controlPanel.visible = controlsVisible;
            if (playing && tvMesh) {
                tvMesh.material.map = videoTexture;
                tvMesh.material.color.set(0xffffff);
            } else if (tvMesh) {
                tvMesh.material.map = null;
                tvMesh.material.color.set(0x111111);
            }
            tvMesh.material.needsUpdate = true;
        }

        function playSound(fStart, fEnd, dur) {
            if(!listener.context) return;
            const osc = listener.context.createOscillator();
            const g = listener.context.createGain();
            osc.connect(g); g.connect(listener.context.destination);
            osc.frequency.setValueAtTime(fStart, listener.context.currentTime);
            osc.frequency.exponentialRampToValueAtTime(fEnd, listener.context.currentTime + dur);
            g.gain.setValueAtTime(0.1, listener.context.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, listener.context.currentTime + dur);
            osc.start(); osc.stop(listener.context.currentTime + dur);
        }

        function resolveButtonMesh(obj) {
            return obj.userData.baseButton || (obj.userData.baseColor ? obj : null);
        }

        // --- LOGIC LOOP ---

        function render() {
            const dt = clock.getDelta();
            const elapsed = clock.getElapsedTime();

            handleLocomotion(dt);
            updateSanta(elapsed);
            updateSnowballs(dt);
            updateSnowParticles();
            handleInteraction();

            if (videoElement && videoElement.readyState >= 2 && isVideoPlaying()) {
                videoTexture.needsUpdate = true;
            }

            renderer.render(scene, camera);
        }

        function isVideoPlaying() { return !videoElement.paused && !videoElement.ended; }

        function handleLocomotion(dt) {
            const s = renderer.xr.getSession();
            if(!s) return;
            // Simple Left Stick movement
            const sources = s.inputSources;
            for(let src of sources) {
                if(src.handedness === 'left' && src.gamepad && src.gamepad.axes.length >= 4) {
                    const x = src.gamepad.axes[2];
                    const z = src.gamepad.axes[3];
                    if(Math.abs(x)>0.1 || Math.abs(z)>0.1) {
                        const dir = new THREE.Vector3(); 
                        camera.getWorldDirection(dir); dir.y=0; dir.normalize();
                        const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0,1,0));
                        dolly.position.addScaledVector(right, x * 2 * dt);
                        dolly.position.addScaledVector(dir, z * 2 * dt);
                    }
                }
            }
        }

        function scheduleNextSantaPass(offset = 0) {
            santaActive = false;
            santaNextPassTime = clock.getElapsedTime() + (offset || (60 + Math.random() * 120));
            if (santaGroup) santaGroup.visible = false;
        }

        function updateSanta(elapsed) {
            if (!santaLoaded || !santaGroup) return;

            if (!santaActive && elapsed >= santaNextPassTime) {
                santaActive = true;
                santaPassStart = elapsed;
                
                // Random path high in sky
                const y = 25 + Math.random() * 5;
                const z = -60 + Math.random() * 80; 
                santaStartPos.set(-100, y, z);
                santaEndPos.set(100, y, z + (Math.random()*20 - 10));
                santaGroup.position.copy(santaStartPos);
                santaGroup.visible = true;
                
                // Play sound
                if(santaSound && !santaSound.isPlaying) santaSound.play();
            }

            if (santaActive) {
                const t = (elapsed - santaPassStart) / santaPassDuration;
                if (t >= 1) {
                    scheduleNextSantaPass();
                } else {
                    santaGroup.position.lerpVectors(santaStartPos, santaEndPos, t);
                    santaGroup.lookAt(santaEndPos);
                    santaGroup.children.forEach(c => {
                        if(c.name!=='santa_audio') c.rotation.z = Math.sin(elapsed*5)*0.1; // jiggle
                    });
                }
            }
        }

        function updateSnowballs(dt) {
            // 1. Move and Ground Check
            for(const sb of thrownSnowballs) {
                if(sb.stopped) continue;

                sb.vel.y -= SNOWBALL_GRAVITY * dt;
                sb.mesh.position.addScaledVector(sb.vel, dt);

                const groundY = getGroundHeight(sb.mesh.position.x, sb.mesh.position.z) + sb.radius*0.8; // Sink slightly
                if(sb.mesh.position.y <= groundY) {
                    sb.mesh.position.y = groundY;
                    sb.vel.set(0,0,0);
                    sb.stopped = true;
                }
            }

            // 2. Simple Collision (Piling)
            // Limit checks for performance
            const checkCount = Math.min(thrownSnowballs.length, 100);
            for(let i=0; i<checkCount; i++) {
                const a = thrownSnowballs[i];
                for(let j=i+1; j<checkCount; j++) {
                    const b = thrownSnowballs[j];
                    
                    const distSq = a.mesh.position.distanceToSquared(b.mesh.position);
                    const minD = a.radius + b.radius;
                    
                    if(distSq < minD*minD) {
                        // Collided
                        const dist = Math.sqrt(distSq);
                        const overlap = minD - dist;
                        const normal = tempVecA.subVectors(a.mesh.position, b.mesh.position).normalize();
                        
                        // Push apart
                        const adjust = normal.multiplyScalar(overlap * 0.5);
                        a.mesh.position.add(adjust);
                        b.mesh.position.sub(adjust);
                        
                        // If moving fast (bullet hit pile), stop
                        if(!a.stopped || !b.stopped) {
                             a.vel.multiplyScalar(0.5); b.vel.multiplyScalar(0.5);
                             a.stopped = true; b.stopped = true;
                        }
                    }
                }
            }
        }

        function updateSnowParticles() {
            if(!snowSystem.mesh) return;
            const pos = snowSystem.mesh.geometry.attributes.position.array;
            for(let i=0; i<SNOW_COUNT; i++) {
                const yIdx = i*3+1;
                pos[yIdx] += snowSystem.velocities[i].y;
                if(pos[yIdx] < 0) pos[yIdx] = 20;
                pos[i*3] += snowSystem.velocities[i].x;
                pos[i*3+2] += snowSystem.velocities[i].z;
            }
            snowSystem.mesh.geometry.attributes.position.needsUpdate = true;
        }

        function handleInteraction() {
            // Check Rays for 1. Buttons (UI) and 2. Snowballs (Melting)
            [controller1, controller2].forEach(c => {
                tempMatrix.identity().extractRotation(c.matrixWorld);
                raycaster.ray.origin.setFromMatrixPosition(c.matrixWorld);
                raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

                // UI Highlight
                const uiHits = raycaster.intersectObjects(interactableObjects, true);
                if(uiHits.length > 0) {
                    const btn = resolveButtonMesh(uiHits[0].object);
                    if(btn && !btn.userData.hovered) {
                        btn.userData.hovered = true;
                        btn.material.emissive.setHex(0xffff00);
                    }
                    cursor.position.copy(uiHits[0].point);
                    cursor.visible = true;
                    // Reset line length
                    const line = c.getObjectByName('line');
                    if(line) line.scale.z = uiHits[0].distance;
                    return; 
                } else {
                    // Reset UI highlights
                    interactableObjects.forEach(obj => {
                        const b = resolveButtonMesh(obj);
                        if(b && b.userData.hovered) {
                            b.userData.hovered = false;
                            b.material.emissive.setHex(b.userData.baseEmissive);
                        }
                    });
                }

                // Melt Snowballs (Laser Effect)
                // Filter only snowballs for intersection
                const snowMeshes = thrownSnowballs.map(s => s.mesh);
                const snowHits = raycaster.intersectObjects(snowMeshes);
                
                const line = c.getObjectByName('line');

                if(snowHits.length > 0) {
                    const hitObj = snowHits[0].object;
                    const sb = thrownSnowballs.find(s => s.mesh === hitObj);
                    if(sb) {
                        // Melt logic
                        sb.scale -= 0.05;
                        sb.mesh.scale.setScalar(sb.scale);
                        if(sb.scale <= 0.1) {
                            scene.remove(sb.mesh);
                            thrownSnowballs = thrownSnowballs.filter(s => s !== sb);
                        }
                        // Visuals
                        cursor.position.copy(snowHits[0].point);
                        cursor.visible = true;
                        if(line) line.scale.z = snowHits[0].distance;
                    }
                } else {
                    cursor.visible = false;
                    if(line) line.scale.z = 50; // Long laser
                }
            });
        }

        // Desktop interaction for testing
        function onPointerDown(event) {
            if(renderer.xr.isPresenting) return;
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(interactableObjects, true);
            if(hits.length > 0) {
                const btn = resolveButtonMesh(hits[0].object);
                if(btn) handleButtonAction(btn.name);
            }
        }

        function onPointerMove(event) {
            if(renderer.xr.isPresenting) return;
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>

    <script>
    (function(){
        if (document.getElementById('gp-cursor')) return;
        let gpIndex=null, lastPrimary=false; const cursor={x:innerWidth/2,y:innerHeight/2};
        const el=document.createElement('div'); el.id='gp-cursor'; el.style.cssText='position:fixed;left:0;top:0;width:14px;height:14px;background:rgba(255,255,255,0.9);border-radius:50%;box-shadow:0 0 12px rgba(0,200,255,0.9);transform:translate(-50%,-50%);pointer-events:none;z-index:99999;display:none;'; document.body.appendChild(el);
        window.addEventListener('gamepadconnected', (e)=>{gpIndex=e.gamepad.index; el.style.display='block';}); window.addEventListener('gamepaddisconnected',(e)=>{ if(gpIndex===e.gamepad.index) gpIndex=null; el.style.display='none';});
        function simulateMouse(type,x,y){ const t=document.elementFromPoint(x,y); if(!t) return; t.dispatchEvent(new MouseEvent(type,{view:window,bubbles:true,cancelable:true,clientX:Math.round(x),clientY:Math.round(y)})); }
        function poll(){ const gps = navigator.getGamepads && navigator.getGamepads(); const gp=(gpIndex!==null && gps && gps[gpIndex])?gps[gpIndex]:(gps&&gps[0]); if(gp){ const lx=gp.axes[0]||0, ly=gp.axes[1]||0; const sensitivity=Math.max(innerWidth,innerHeight)*0.02; cursor.x=Math.min(innerWidth,Math.max(0,cursor.x+lx*sensitivity)); cursor.y=Math.min(innerHeight,Math.max(0,cursor.y+ly*sensitivity)); el.style.left=cursor.x+'px'; el.style.top=cursor.y+'px'; const primary=!!(gp.buttons && gp.buttons[0] && gp.buttons[0].pressed); if(primary && !lastPrimary){ simulateMouse('pointerdown',cursor.x,cursor.y); simulateMouse('mousedown',cursor.x,cursor.y);} else if(!primary && lastPrimary){ simulateMouse('pointerup',cursor.x,cursor.y); simulateMouse('mouseup',cursor.x,cursor.y); simulateMouse('click',cursor.x,cursor.y);} lastPrimary=primary;} requestAnimationFrame(poll);} requestAnimationFrame(poll);
    })();
    </script>
